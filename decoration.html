<script>
let orders=[],lines=[],tab=location.hash==="#reports"?"prod":"open",Q="",repCtl=null;

/* صور أكواد الرسمات (بتظهر للعمال عند الإنتاج) */
let CIMG=new Map(),cimgAt=0;
async function loadCodeImgs(){
  if(CIMG.size&&Date.now()-cimgAt<120000)return;
  try{const r=await db.from("catalog").select("name,image").eq("kind","code").not("image","is",null);
    if(!r.error&&r.data){CIMG=new Map(r.data.map(x=>[norm(x.name),safeAv(x.image)]).filter(x=>x[1]));cimgAt=Date.now()}}catch(e){}
}
const cimg=c=>CIMG.get(norm(c))||"";
const cthumb=c=>{const u=cimg(c);return u?`<span class="dthumb" data-zc="${esc(c)}" style="background-image:url('${u}')" role="button" aria-label="تكبير صورة الرسمة"></span>`:""};
function zoomCode(c){
  const u=cimg(c);if(!u)return;
  const d=document.createElement("div");d.className="ov";d.style.zIndex=60;
  d.innerHTML=`<div class="modal"><h3>كود ${esc(c)}</h3><img class="zoomimg" alt="" src="${u}" style="max-height:70vh"><div class="row"><button class="btn ghost" id="zx" type="button" style="flex:1">إغلاق</button></div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="zx")d.remove()};
}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zc]");if(z)zoomCode(z.dataset.zc)});
async function load(){
  await loadCodeImgs();
  const[o,l,pr,ft]=await Promise.all([
    db.from("deco_orders").select("*").order("created_at",{ascending:false}),
    db.from("deco_lines_status").select("*").order("id"),
    db.from("deco_production").select("id,line_id,qty,prod_date").order("prod_date",{ascending:false}).order("id",{ascending:false}),
    freeTodayQty("deco")
  ]);
  if(o.error||l.error){fail("orders",load);return}
  FREE_T=ft;orders=o.data;lines=l.data;prods=pr.data||[];renderOrders();
}

let prods=[];
function logHtml(id){
  const p=prods.filter(x=>x.line_id===id);
  if(!p.length)return"";
  return '<div class="nums" style="font-size:.85rem">'+p.slice(0,6).map(e=>`${e.qty} (${fmtD(e.prod_date)})`).join(" · ")+(p.length>6?` · +${p.length-6}`:"")+"</div>";
}
async function editOrder(id){
  const o=orders.find(x=>x.id===id);
  const{data:ol,error:le}=await db.from("deco_lines").select("id,code,qty_required").eq("order_id",id).order("id");
  if(le){toast("خطأ: "+le.message);return}
  const row=l=>`<div class="two nr" data-id="${l?l.id:""}"><input class="c" placeholder="كود الرسمة" value="${esc(l?l.code:"")}"><input class="q" type="number" min="1" inputmode="numeric" placeholder="الكمية" value="${l?l.qty_required:""}"></div>`;
  openModal("تعديل الطلبية",`<label>الصنف</label><input id="m-item" value="${esc(o.item)}"><label>تاريخ الطلبية</label><input type="date" id="m-od" value="${o.order_date||today()}"><label>تاريخ التسليم (اختياري)</label><input type="date" id="m-due" value="${o.due_date||''}">
    <label>الأكواد والكميات المطلوبة</label><div id="m-rows">${(ol||[]).map(row).join("")}</div>
    <button class="btn ghost sm" id="m-addc" type="button" style="width:100%;margin-top:6px">+ كود جديد</button>
    <div class="hint">غيّر الاسم أو الكمية مباشرة، أو أضف جديد. للحذف أو سجل الإنتاج استخدم «تعديل / سجل» تحت كل بند.</div>`,async()=>{
    const item=document.getElementById("m-item").value.trim();
    if(!item){toast("اكتب الصنف");return false}
    const rs=[...document.querySelectorAll("#m-rows .nr")].map(r=>({id:r.dataset.id?+r.dataset.id:null,code:r.querySelector(".c").value.trim(),qty:parseInt(r.querySelector(".q").value)}));
    const fresh=rs.filter(r=>!r.id&&(r.code||r.qty));
    if(rs.some(r=>r.id&&(!r.code||!(r.qty>0)))||fresh.some(r=>!r.code||!(r.qty>0))){toast("كمّل الاسم والكمية في كل بند");return false}
    let e=(await db.from("deco_orders").update({item,order_date:document.getElementById("m-od").value||today(),due_date:document.getElementById("m-due").value||null}).eq("id",id)).error;
    if(e){toast("خطأ: "+e.message);return false}
    const old=new Map((ol||[]).map(l=>[l.id,l]));
    for(const r of rs.filter(r=>r.id)){
      const b=old.get(r.id);if(!b||(b.code===r.code&&b.qty_required===r.qty))continue;
      e=(await db.from("deco_lines").update({code:r.code,qty_required:r.qty}).eq("id",r.id)).error;
      if(e){toast("خطأ: "+e.message);return false}
    }
    if(fresh.length){
      e=(await db.from("deco_lines").insert(fresh.map(r=>({order_id:id,code:r.code,qty_required:r.qty})))).error;
      if(e){toast("خطأ: "+e.message);return false}
    }
    await syncStatus(id);await load();toast(fresh.length?"تم التعديل وإضافة "+fresh.length+" كود جديد":"تم التعديل");
  });
  document.getElementById("m-addc").onclick=()=>{
    const box=document.getElementById("m-rows");box.insertAdjacentHTML("beforeend",row(null));
    const nr=box.lastElementChild;try{attachLists(nr)}catch(x){}nr.querySelector(".c").focus();
  };
}
function postpone(id){postponeOrder("deco","deco_orders",orders.find(x=>x.id===id),load)}
function drawStats(){
  const open=orders.filter(o=>o.status==="open"),ids=new Set(open.map(o=>o.id)),t=today();
  kpis("stats",[["طلبيات مفتوحة",open.length],["المتبقي للإنجاز",lines.filter(l=>ids.has(l.order_id)).reduce((a,l)=>a+Math.max(l.total_required-l.produced,0),0)],["إنتاج النهارده",prods.filter(p=>p.prod_date===t).reduce((a,p)=>a+p.qty,0)+FREE_T,"var(--ok)"]]);
}
function renderOrders(){
  try{tabCount("open",orders.filter(o=>o.status==="open").length);tabCount("done",orders.filter(o=>o.status==="done").length)}catch(e){}
  drawStats();
  const list=orders.filter(o=>o.status===tab&&hit(Q,o.item,...lines.filter(x=>x.order_id===o.id).map(x=>x.code)));
  const box=document.getElementById("orders");
  if(!list.length){box.innerHTML=`<div class="empty">${Q?"مفيش نتائج للبحث":tab==="open"?"مفيش طلبيات مفتوحة. اضغط «طلبية جديدة».":"مفيش طلبيات مكتملة."}</div>`;return}
  box.innerHTML=list.map(o=>{
    const ls=lines.filter(x=>x.order_id===o.id),done=o.status==="done";
    return `<div class="card ${done?"done":""}">
      <div class="top"><b>${esc(o.item)}</b><span>${lateOrder(o)?'<span class="tag late">متأخرة</span> ':""}<span class="tag ${done?"ok":""}">${done?"مكتملة":"مفتوحة"}</span></span></div>
      <div class="nums">${dueTag(o)}${o.postponed_count?` <span class="tag">اتأجلت ${o.postponed_count} مرة</span>`:""}</div>
      <div class="nums">تاريخ الطلبية: <b>${fmtD(o.order_date)}</b>${done?"":` · ${ageTxt(o.order_date)}`}</div>
      ${done?'<div class="banner ibt">'+ui("checkc")+'<span>اكتملت الطلبية</span></div>':""}
      ${ls.map(x=>{
        const rem=Math.max(x.total_required-x.produced,0),pct=Math.min(100,Math.round(x.produced/x.total_required*100));
        return `<div class="line ${rem===0?"full":""}">
          <div class="r"><span class="dl">${cthumb(x.code)}<b>كود ${esc(x.code)}</b></span>
          <span class="nums">مطلوب <b>${x.total_required}</b> · تم <b>${x.produced}</b> · متبقي <b>${rem}</b></span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          ${logHtml(x.id)}
          <div class="row" style="margin-top:4px">${rem>0?`<button class="btn sm" onclick="produce(${x.id})">تسجيل إنتاج</button>`:""}<button class="btn ghost sm" onclick="lineDetails(${x.id})">تعديل / سجل</button></div>
        </div>`}).join("")}
      <div class="row"><button class="btn ghost sm" onclick="increase(${o.id})">زيادة الطلبية</button><button class="btn ghost sm" onclick="delOrder(${o.id})">حذف الطلبية</button><button class="btn ghost sm" onclick="editOrder(${o.id})">تعديل الطلبية</button>${done?"":`<button class="btn ghost sm" onclick="postpone(${o.id})">تأجيل</button>`}</div>
    </div>`;
  }).join("");
}

async function syncStatus(orderId){
  const{data}=await db.from("deco_lines_status").select("*").eq("order_id",orderId);
  const done=data.length>0&&data.every(x=>x.produced>=x.total_required);
  const o=orders.find(x=>x.id===orderId),st=done?"done":"open";
  if(o&&o.status!==st)await db.from("deco_orders").update({status:st}).eq("id",orderId);
  return done;
}

function produce(lineId){
  const x=lines.find(l=>l.id===lineId),rem=x.total_required-x.produced;
  openModal(`إنتاج كود ${esc(x.code)}`,`${XT(true)}${cimg(x.code)?`<img class="dzoom" alt="" src="${cimg(x.code)}" data-zc="${esc(x.code)}">`:""}<div class="nums">المتبقي: <b>${rem}</b></div><label>الكمية اللي عملتها</label><input type="number" id="m-q" min="1" inputmode="numeric"><label>التاريخ</label><input type="date" id="m-d" value="${today()}">${XF(true)}`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    const pd=document.getElementById("m-d").value||today(),xr=xfRead(),po=orders.find(o=>o.id===x.order_id);
    if(!await reviewSave({title:"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(pd)],...rvFields(xr)],items:[{title:po?po.item:"",rows:[["كود الرسمة",x.code],["الكمية",nf(q)],["المتبقي بعد التسجيل",remAfter(rem,q)]],warn:overWarn(rem,q)}]}))return false;
    const{error}=await insertRow("deco_production",{line_id:lineId,qty:q,prod_date:pd,...xr});
    if(error){toast("خطأ: "+error.message);return false}
    const done=await syncStatus(x.order_id);await load();
    if(q>rem)overToast(1,q-rem);else toast(done?"اكتملت الطلبية":"تم التسجيل");
  });
}

async function lineDetails(lineId){
  const x=lines.find(l=>l.id===lineId);
  const[p,i,l]=await Promise.all([
    db.from("deco_production").select("*").eq("line_id",lineId).order("prod_date",{ascending:false}),
    db.from("deco_increases").select("*").eq("line_id",lineId).order("created_at",{ascending:false}),
    db.from("deco_lines").select("qty_required").eq("id",lineId).single()
  ]);
  const ent=(t,r)=>(r.data||[]).length?r.data.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span><b>${e.qty}</b> <span class="nums">${fmtD(e.prod_date||e.created_at.slice(0,10))}${e.worker?" · "+esc(e.worker):""}${e.design?" · "+esc(e.design):""}</span></span><button class="btn ghost sm" onclick="delEntry('${t}',${e.id},${lineId})">حذف</button></div>`).join(""):'<div class="nums">لا يوجد</div>';
  openModal("تعديل الكود "+esc(x.code),`<label>الكود</label><input id="m-name" value="${esc(x.code)}">
    <label>الكمية الأصلية المطلوبة</label><input type="number" id="m-req" min="1" inputmode="numeric" value="${l.data?l.data.qty_required:""}">
    <h3>سجل الإنتاج</h3>${ent("deco_production",p)}
    <h3 style="margin-top:12px">سجل الزيادات</h3>${ent("deco_increases",i)}
    <div class="row"><button class="btn ghost sm" onclick="delLine(${lineId})">حذف الكود</button></div>`,async()=>{
    const c=document.getElementById("m-name").value.trim(),q=parseInt(document.getElementById("m-req").value);
    if(!c||!(q>0)){toast("كمّل البيانات");return false}
    const{error}=await db.from("deco_lines").update({code:c,qty_required:q}).eq("id",lineId);
    if(error){toast("خطأ: "+error.message);return false}
    await syncStatus(x.order_id);await load();toast("تم التعديل");
  });
}
async function delEntry(t,id,lineId){
  if(!await ask("حذف السجل ده؟"))return;
  const oid=lines.find(l=>l.id===lineId).order_id;
  const{data:dd,error}=await db.from(t).delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await syncStatus(oid);await load();lineDetails(lineId);
}
async function delLine(lineId){
  if(!await ask("حذف الكود وكل سجلاته؟"))return;
  const oid=lines.find(l=>l.id===lineId).order_id;
  const{data:dd,error}=await db.from("deco_lines").delete().eq("id",lineId).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  closeModal();await syncStatus(oid);await load();toast("تم الحذف");
}
async function delOrder(id){
  if(!await ask("حذف الطلبية بكل بياناتها؟"))return;
  const{data:dd,error}=await db.from("deco_orders").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}

function increase(orderId){
  const ls=lines.filter(l=>l.order_id===orderId);
  openModal("زيادة الطلبية",`<label>الكود</label><select id="m-line">${ls.map(l=>`<option value="${l.id}">${esc(l.code)}</option>`).join("")}<option value="new">+ كود جديد</option></select>
    <div id="m-newc" style="display:none"><label>الكود الجديد</label><input id="m-code"></div>
    <label>الكمية المضافة</label><input type="number" id="m-q" min="1" inputmode="numeric">`,async()=>{
    const q=parseInt(document.getElementById("m-q").value),v=document.getElementById("m-line").value;
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    let r;
    if(v==="new"){
      const c=document.getElementById("m-code").value.trim();
      if(!c){toast("اكتب الكود");return false}
      r=await db.from("deco_lines").insert({order_id:orderId,code:c,qty_required:q});
    }else r=await db.from("deco_increases").insert({line_id:parseInt(v),qty:q});
    if(r.error){toast("خطأ: "+r.error.message);return false}
    await syncStatus(orderId);await load();toast("تمت الزيادة");
  });
  document.getElementById("m-line").onchange=e=>document.getElementById("m-newc").style.display=e.target.value==="new"?"block":"none";
}

function newOrder(){
  const crow=()=>`<div class="two nr"><input placeholder="كود الرسمة" class="c"><input placeholder="الكمية" class="q" type="number" min="1" inputmode="numeric"></div>`;
  const blk=n=>`<div class="itemblk"><div class="ih"><b>الصنف ${n}</b><button type="button" class="rmi" style="display:${n>1?"block":"none"}">${ib("trash","حذف الصنف")}</button></div><input class="it" placeholder="اسم الصنف"><label>الأكواد والكميات</label><div class="rows">${crow()}</div><button class="btn ghost sm addc" type="button">+ كود</button></div>`;
  openModal("طلبية جديدة",`<label>تاريخ الطلبية</label><input type="date" id="m-od" value="${today()}"><label>تاريخ التسليم (اختياري)</label><input type="date" id="m-due"><div id="m-items">${blk(1)}</div><button class="btn sm" id="m-addi" type="button" style="width:100%;margin-top:4px">+ إضافة صنف</button>`,async()=>{
    const blocks=[...document.querySelectorAll("#m-items .itemblk")].map(b=>({
      item:b.querySelector(".it").value.trim(),
      rs:[...b.querySelectorAll(".nr")].map(r=>({sub:r.querySelector(".c").value.trim(),qty:parseInt(r.querySelector(".q").value)})).filter(r=>r.sub||r.qty)
    })).filter(b=>b.item||b.rs.length);
    if(!blocks.length){toast("اكتب الصنف");return false}
    for(const [i,b] of blocks.entries()){
      if(!b.item){toast("اكتب اسم الصنف رقم "+(i+1));return false}
      if(!b.rs.length||b.rs.some(r=>!r.sub||!(r.qty>0))){toast("كمّل بيانات الصنف: "+b.item);return false}
    }
    const od=document.getElementById("m-od").value||today(),due=document.getElementById("m-due").value||null,made=[];
    const rollback=async()=>{for(const id of made){try{await db.from("deco_orders").delete().eq("id",id)}catch(e){}}};
    for(const b of blocks){
      const{data,error}=await db.from("deco_orders").insert({item:b.item,order_date:od,due_date:due}).select().single();
      if(error){await rollback();toast("خطأ: "+error.message);return false}
      made.push(data.id);
      const e2=(await db.from("deco_lines").insert(b.rs.map(r=>({order_id:data.id,code:r.sub,qty_required:r.qty})))).error;
      if(e2){await rollback();toast("خطأ: "+e2.message);return false}
    }
    tab="open";setTab();await load();toast(blocks.length>1?"تمت إضافة "+blocks.length+" أصناف في الطلبية":"تمت إضافة الطلبية");
  });
  const box=document.getElementById("m-items");
  const renum=()=>[...box.querySelectorAll(".itemblk")].forEach((b,i)=>{b.querySelector(".ih b").textContent="الصنف "+(i+1);b.querySelector(".rmi").style.display=i>0?"block":"none"});
  document.getElementById("m-addi").onclick=()=>{
    box.insertAdjacentHTML("beforeend",blk(box.children.length+1));
    const nb=box.lastElementChild;if(typeof attachLists==="function")try{attachLists(nb)}catch(e){}
    nb.scrollIntoView({behavior:"smooth",block:"nearest"});nb.querySelector(".it").focus({preventScroll:true});
  };
  box.addEventListener("click",e=>{
    const t=e.target;
    if(t.classList.contains("addc"))t.parentElement.querySelector(".rows").insertAdjacentHTML("beforeend",crow());
    else if(t.classList.contains("rmi")){t.closest(".itemblk").remove();renum()}
  });
}

function setTab(){
  ["open","done","wk","prod"].forEach(k=>document.getElementById("t-"+k).className="btn "+(k===tab?"on":"ghost"));
  document.getElementById("wkView").style.display=tab==="wk"?"block":"none";
  document.getElementById("ordersView").style.display=tab==="prod"||tab==="wk"?"none":"block";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  document.getElementById("newOrder").style.display=tab==="open"?"block":"none";
  document.getElementById("freeRow").style.display=tab==="open"?"flex":"none";
  try{history.replaceState(null,"","#"+tab);window.markSub&&markSub()}catch(e){}
  if(tab==="wk")return drawWk();
  if(tab==="prod"){repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","deco")}
  else renderOrders();
}
document.getElementById("t-open").onclick=()=>{tab="open";setTab()};
document.getElementById("t-done").onclick=()=>{tab="done";setTab()};
document.getElementById("t-wk").onclick=()=>{tab="wk";setTab()};
/* ===== إجمالي إنتاج كل عامل (تلقائي من كل الأصناف) ===== */
let wkRange="today";
async function drawWk(){
  const out=document.getElementById("wkOut");out.innerHTML='<i class="sk" style="height:120px;border-radius:14px"></i>';
  let f=document.getElementById("wkF").value,t=document.getElementById("wkT").value;
  if(!f&&!t){const T=today();[f,t]=wkRange==="today"?[T,T]:wkRange==="7"?[addDays(T,-6),T]:wkRange==="month"?[T.slice(0,8)+"01",T]:["",""]}
  let d,W=[];
  try{d=await Reports.getData("deco",true)}catch(e){out.innerHTML='<div class="empty err-state">تعذر تحميل البيانات</div>';return}
  try{const r=await db.from("workers").select("name,daily_target").eq("active",true);W=r.data||[]}catch(e){}
  const tg=new Map(W.map(x=>[x.name,+x.daily_target||0]));
  const rows=d.prod.filter(x=>(!f||x.d>=f)&&(!t||x.d<=t));
  const by=new Map();
  rows.forEach(x=>{const k=x.w||"— بدون اسم عامل —";const o=by.get(k)||{tot:0,it:new Map(),days:new Set()};o.tot+=x.qty;o.days.add(x.d);
    const ik=x.item+(x.sub?" — كود "+x.sub:"")+(x.n?" — "+x.n:"");o.it.set(ik,(o.it.get(ik)||0)+x.qty);by.set(k,o)});
  const list=[...by].sort((a,b)=>b[1].tot-a[1].tot),all=rows.reduce((a,x)=>a+x.qty,0);
  const days=f&&t?daysBetween(f,t)+1:0;
  out.innerHTML='<div class="kpis mini three" id="wkK"></div><div id="wkL"></div>';
  kpis("wkK",[["إجمالي الإنتاج",all],["عمال",list.filter(x=>x[0][0]!=="—").length],["تسجيلات",rows.length]]);
  document.getElementById("wkL").innerHTML=
  (list.length?list.map(([n,o])=>{const T=tg.get(n)||0,need=T*Math.max(1,days||o.days.size),pc=need?Math.round(o.tot/need*100):0;
    return`<div class="card"><div class="r" style="display:flex;justify-content:space-between"><b>${esc(n)}</b><b>${nf(o.tot)}</b></div>${T?`<div class="nums">المعدل المطلوب ${nf(T)} يوميًا × ${nf(Math.max(1,days||o.days.size))} يوم = ${nf(need)} · <b style="color:${pc>=100?"var(--ok)":"var(--bad,#c0392b)"}">${pc}%</b></div>`:""}
    <div style="margin-top:6px">${[...o.it].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="nums" style="display:flex;justify-content:space-between;padding:2px 0"><span>${esc(k)}</span><b>${nf(v)}</b></div>`).join("")}</div></div>`}).join(""):'<div class="empty">مفيش إنتاج في الفترة دي</div>');
}
document.querySelectorAll("#wkR button").forEach(b=>b.onclick=()=>{wkRange=b.dataset.r;document.getElementById("wkF").value="";document.getElementById("wkT").value="";document.querySelectorAll("#wkR button").forEach(x=>x.classList.toggle("on",x===b));drawWk()});
["wkF","wkT"].forEach(i=>document.getElementById(i).onchange=()=>{document.querySelectorAll("#wkR button").forEach(x=>x.classList.remove("on"));drawWk()});
document.getElementById("t-prod").onclick=()=>{tab="prod";setTab()};
document.getElementById("newOrder").onclick=newOrder;
document.getElementById("freeBtn").onclick=()=>freeProduction("deco",load);
(async()=>{if(await requireAuth("decoration.html")){renderNav("decoration.html");searchBox("orders",q=>{Q=q;renderOrders()});skel("orders",3);if(tab==="prod")setTab();load().finally(settle)}})();
</script>
<script src="install.js" defer></script>
</body>

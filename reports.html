<div class="wrap">
  <h1>التقارير</h1>
  <div class="card noprint" id="dayBar"><h3>التقرير اليومي</h3><div class="two"><div><label>اليوم</label><input type="date" id="dayD"></div><div style="display:flex;align-items:flex-end;gap:6px"><button class="btn" id="dayGo" style="flex:1">عرض</button><button class="btn ghost" onclick="window.print()" style="flex:1">PDF / طباعة</button></div></div></div>
  <div id="daily"></div>
  <div id="dash"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="reports.js"></script>
<script>
let ctl=null;
async function daily(){
  const day=document.getElementById("dayD").value||today(),box=document.getElementById("daily");
  box.innerHTML='<i class="sk" style="height:120px;border-radius:14px"></i>';
  const S=Reports.sources,keys=Object.keys(S);
  const res=await Promise.allSettled(keys.map(k=>Reports.getData(k)));
  const W=new Map(),NT=[];let tot=0,html="",wq=0,wg=0,late=0,open=0;
  res.forEach((r,i)=>{
    const c=S[keys[i]];
    if(r.status!=="fulfilled"){html+=`<div class="card"><h3>${c.name}</h3><div class="empty">تعذر التحميل</div></div>`;return}
    const d=r.value,rows=d.prod.filter(x=>x.d===day),sum=rows.reduce((a,x)=>a+x.qty,0);tot+=sum;
    if(d.ord){const o=d.ord.filter(x=>x.status==="open");open+=o.length;late+=o.filter(x=>isLate(x.status,x.date)).length}
    if(d.waste){const w=d.waste.filter(x=>x.d===day);wq+=w.reduce((a,x)=>a+x.qty,0);wg+=w.reduce((a,x)=>a+x.good,0)}
    rows.forEach(x=>{if(x.w){const k=x.w+"|"+c.name,o=W.get(k)||{w:x.w,s:c.name,q:0};o.q+=x.qty;W.set(k,o)}if(x.n)NT.push({s:c.name,t:x.item+(x.sub?" — "+x.sub:""),n:x.n,w:x.w})});
    const m=new Map();rows.forEach(x=>{const k=x.item+(x.sub?" — "+x.sub:"");m.set(k,(m.get(k)||0)+x.qty)});
    html+=`<div class="card"><div class="top"><h3 style="margin:0">${c.name}</h3><span class="tag">${nf(sum)}</span></div>${m.size?`<table><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody>${[...m].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${nf(v)}</b></td></tr>`).join("")}</tbody></table>`:'<div class="empty">مفيش إنتاج مسجل في اليوم ده</div>'}</div>`;
  });
  const wp=wq+wg?(wq/(wq+wg)*100).toFixed(1)+"%":"-";
  box.innerHTML=`<div class="print-head"><h2>التقرير اليومي</h2><div class="nums">${fmtD(day)}</div></div>
   <div class="kpis"><div class="kpi"><div class="kv">${nf(tot)}</div><small>إجمالي الإنتاج</small></div><div class="kpi"><div class="kv">${nf(wq)}</div><small>هالك الجليز</small></div><div class="kpi"><div class="kv">${wp}</div><small>نسبة الهالك</small></div><div class="kpi"><div class="kv">${open}${late?` <small>(${late} متأخرة)</small>`:""}</div><small>طلبيات مفتوحة</small></div></div>`+html+(W.size?`<div class="card"><h3>العمال</h3><table><thead><tr><th>العامل</th><th>القسم</th><th>الكمية</th></tr></thead><tbody>${[...W.values()].sort((a,b)=>b.q-a.q).map(o=>`<tr><td><b>${esc(o.w)}</b></td><td>${o.s}</td><td><b>${nf(o.q)}</b></td></tr>`).join("")}</tbody></table></div>`:"")+(NT.length?`<div class="card"><h3>ملاحظات اليوم</h3>${NT.map(x=>`<div class="line"><b>${x.s} · ${esc(x.t)}</b>${x.w?` <span class="tag">${esc(x.w)}</span>`:""}<div class="nums">${esc(x.n)}</div></div>`).join("")}</div>`:"");
}
async function load(){if(ctl)await ctl.refresh()}
(async()=>{if(await requireAuth("reports.html")){renderNav("reports.html");document.getElementById("dayD").value=today();document.getElementById("dayGo").onclick=daily;document.getElementById("dayD").onchange=daily;daily();ctl=Reports.dashboard("dash");settle()}})();
</script>
<script src="install.js" defer></script>
</body>

<script>try{var n=performance.getEntriesByType("navigation")[0];if(sessionStorage.getItem("sp")&&!(n&&n.type==="reload"))document.getElementById("splash").remove()}catch(e){}</script>
<div class="wrap">
  <h1>تصليح</h1>
  <div class="tabs noprint"><button class="btn on" id="t-log">السجل</button><button class="btn ghost" id="t-prod">تقارير</button></div>
  <div id="logView">
  <div class="kpis mini three" id="stats"></div>
  <button class="btn noprint" id="add" style="width:100%;margin-bottom:12px">+ تسجيل تصليح</button>
  <div class="card noprint">
    <div class="two"><div><label>من</label><input type="date" id="f-from"></div><div><label>إلى</label><input type="date" id="f-to"></div></div>
    <label>الصنف</label><select id="f-item"><option value="">الكل</option></select>
    <div class="row"><button class="btn" id="f-go">عرض</button><button class="btn ghost" id="f-csv">تصدير Excel</button><button class="btn ghost" onclick="window.print()">طباعة</button></div>
  </div>
  <div class="total" id="total"></div>
  <div class="nums" id="brk" style="margin-bottom:10px"></div>
  <div class="scroll" id="tbl"><table><thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th class="noprint"></th></tr></thead><tbody id="body"></tbody></table></div>
  </div>
  <div id="prodRep" style="display:none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="reports.js"></script>
<script>
let rows=[],Q="",repCtl=null,tab=location.hash==="#reports"?"prod":"log";
const NONE="بدون صنف";

async function load(){
  const{data,error}=await db.from("repair_log").select("*").order("repair_date",{ascending:false}).order("id",{ascending:false});
  if(error){fail("body",load);return}
  rows=data.map(r=>({id:r.id,d:r.repair_date,item:r.item||"",qty:r.qty}));
  const s=document.getElementById("f-item"),cur=s.value;
  s.innerHTML='<option value="">الكل</option><option value="__none">'+NONE+'</option>'+[...new Set(rows.map(r=>r.item).filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join("");
  s.value=cur;draw();drawStats();
}
function drawStats(){
  const t=today(),m=t.slice(0,8)+"01";
  kpis("stats",[["تصليح النهارده",sumQty(rows,t,t),"var(--ok)"],["هذا الشهر",sumQty(rows,m,t)],["الإجمالي",rows.reduce((a,r)=>a+r.qty,0)]]);
}
function setTab(){
  document.getElementById("t-log").className="btn "+(tab==="log"?"on":"ghost");
  document.getElementById("t-prod").className="btn "+(tab==="prod"?"on":"ghost");
  document.getElementById("logView").style.display=tab==="log"?"block":"none";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  try{history.replaceState(null,"",tab==="prod"?"#reports":location.pathname+location.search)}catch(e){}
  if(tab==="prod")repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","repair");
}
function filtered(){
  const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,i=document.getElementById("f-item").value;
  return rows.filter(r=>(!f||r.d>=f)&&(!t||r.d<=t)&&(!i||(i==="__none"?!r.item:r.item===i))&&hit(Q,r.item));
}
function draw(){
  const rs=filtered(),sum=rs.reduce((a,r)=>a+r.qty,0);
  document.getElementById("total").textContent="إجمالي التصليح: "+sum;
  const by={};rs.forEach(r=>{const k=r.item||NONE;by[k]=(by[k]||0)+r.qty});
  document.getElementById("brk").textContent=Object.keys(by).length>1?Object.entries(by).map(([k,v])=>k+": "+v).join(" · "):"";
  document.getElementById("body").innerHTML=rs.length?rs.map(r=>`<tr><td>${fmtD(r.d)}</td><td>${r.item?esc(r.item):'<span class="nums">'+NONE+'</span>'}</td><td><b>${r.qty}</b></td><td class="noprint" style="white-space:nowrap"><button class="btn ghost sm" onclick="form(${r.id})">تعديل</button> <button class="btn ghost sm" onclick="del(${r.id})">حذف</button></td></tr>`).join(""):'<tr><td colspan="4" class="empty">مفيش تصليح مسجل</td></tr>';
}
function form(id){
  const rec=id?rows.find(r=>r.id===id):null;
  const items=[...new Set(rows.map(r=>r.item).filter(Boolean))];
  openModal(rec?"تعديل تصليح":"تسجيل تصليح",`<label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.d:today()}">
    <label>الصنف (اختياري)</label><input id="m-item" list="m-items" value="${rec?esc(rec.item):""}"><datalist id="m-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <label>الكمية</label><input type="number" id="m-q" min="1" inputmode="numeric" value="${rec?rec.qty:""}">`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    const row={repair_date:document.getElementById("m-d").value||today(),item:document.getElementById("m-item").value.trim()||null,qty:q};
    const{error}=rec?await db.from("repair_log").update(row).eq("id",id):await db.from("repair_log").insert(row);
    if(error){toast("خطأ: "+error.message);return false}
    await load();toast(rec?"تم التعديل":"تم التسجيل");
  });
}
async function del(id){
  if(!await ask("حذف السجل ده؟"))return;
  const{data:dd,error}=await db.from("repair_log").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+["التاريخ,الصنف,الكمية",...filtered().map(r=>[r.d,r.item||NONE,r.qty].map(q).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="تصليح.csv";a.click();
}
document.getElementById("add").onclick=()=>form(0);
document.getElementById("f-go").onclick=draw;
document.getElementById("f-csv").onclick=exportCsv;
document.getElementById("t-log").onclick=()=>{tab="log";setTab()};
document.getElementById("t-prod").onclick=()=>{tab="prod";setTab()};
(async()=>{if(await requireAuth("repair.html")){renderNav("repair.html");searchBox("tbl",q=>{Q=q;draw()},"بحث بالصنف…");dateChips("f-from","f-to",draw);skel("body",4);if(tab==="prod")setTab();load().finally(settle)}})();
</script>
<script src="install.js" defer></script>
</body>
</html>

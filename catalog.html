<script>try{var n=performance.getEntriesByType("navigation")[0];if(sessionStorage.getItem("sp")&&!(n&&n.type==="reload"))document.getElementById("splash").remove()}catch(e){}</script>
<div class="wrap">
  <h1>الأصناف والألوان</h1>
  <div class="tabs noprint" id="tb"><button class="btn on" data-k="item">الأصناف</button><button class="btn ghost" data-k="color">الألوان</button><button class="btn ghost" data-k="code">أكواد الزخرفة</button></div>
  <div class="nums" id="hint" style="margin-bottom:8px"></div>
  <div class="catact noprint"><button class="btn" id="addx" type="button"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m17 13-3.5-3.5L5 17"/><path d="M19 17v6M16 20h6"/></svg><span>إضافة بصورة وكود</span></button><button class="btn ghost" id="add" type="button"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12M3 12h8M3 18h8"/><path d="M18 9v8M14 13h8"/></svg><span>عدة أسماء</span></button></div>
  <div class="catbar noprint"><button class="btn ghost" id="vw" type="button"></button><button class="btn ghost" id="sa" type="button">تحديد الكل</button><button class="btn" id="pdf" type="button"></button></div>
  <div class="search"><input type="search" id="q" placeholder="بحث…" aria-label="بحث"></div>
  <div id="list"></div>
</div>
<div id="toast"></div><div id="offline">لا يوجد اتصال بالإنترنت</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
let kind="item",all=[],Q="";
let view=(()=>{try{return localStorage.getItem("catview")||"grid"}catch(e){return"grid"}})();const SEL=new Set();
const NAMES={item:"الأصناف",color:"الألوان",code:"أكواد الزخرفة"};
const HINT={item:"الأصناف (باسمها وكودها وصورتها) بتظهر في القوائم المنسدلة للطلبيات والهالك والتصليح.",color:"الألوان بتظهر في القوائم المنسدلة للجليز والرش.",code:"أكواد الرسمات بتظهر في القوائم المنسدلة للزخرفة (ممكن تضيف صورة الرسمة)."};
const NEED2="لازم تشغّل ملف setup_designs.sql في Supabase الأول (SQL Editor ← Run)";
const NEED="لازم تشغّل ملف setup_v2.sql في Supabase الأول (SQL Editor ← Run)";
const NOPIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>';

async function load(){
  skel("list",3);
  const{data,error}=await db.from("catalog").select("*").order("name");
  if(error){fail("list",load);return}
  data.sort((a,b)=>String(a.name).localeCompare(String(b.name),"ar",{numeric:true}));all=data;draw();
}
const dsOf=x=>{const set=new Set(all.filter(k=>k.kind==="code").map(k=>norm(k.name)));return(Array.isArray(x.designs)?x.designs:[]).filter(n=>set.has(norm(n)))};
const dsBtn=x=>kind==="item"&&dsOf(x).length?`<button class="btn ghost sm" data-v="${x.id}" aria-label="رسمات الصنف">${ib("eye","رسمات ("+dsOf(x).length+")")}</button>`:"";
function draw(){
  document.getElementById("hint").textContent=HINT[kind]+" ("+nf(all.filter(x=>x.kind===kind).length)+")";
  const rs=all.filter(x=>x.kind===kind&&hit(norm(Q),x.name,x.code||""));
  bar(rs);
  if(view==="grid"&&rs.length){
    document.getElementById("list").innerHTML=`<div class="cgrid">${rs.map(x=>{const im=safeAv(x.image),sl=SEL.has(x.id);
      return `<div class="gc ${sl?"sel":""}"><label class="gk"><input type="checkbox" data-s="${x.id}" ${sl?"checked":""} aria-label="تحديد"></label>
      <div class="gi ${im?"has":""}" ${im?`data-z="${x.id}" style="background-image:url('${im}')" role="button" aria-label="تكبير الصورة"`:""}>${im?"":NOPIC}</div>
      <b>${esc(x.name)}</b>${x.code?`<small>${esc(x.code)}</small>`:""}
      <span class="ga">${dsBtn(x)}<button class="btn ghost sm" data-e="${x.id}" aria-label="تعديل">${ib("edit","تعديل")}</button><button class="btn ghost sm dang" data-d="${x.id}" aria-label="حذف">${ib("trash","حذف")}</button></span></div>`}).join("")}</div>`;
    return;
  }
  document.getElementById("list").innerHTML=rs.length?`<div class="card">${rs.map(x=>{
    const im=safeAv(x.image);
    return `<div class="cent"><span class="cthumb ${im?"has":""}" ${im?`data-z="${x.id}" style="background-image:url('${im}')" role="button" aria-label="تكبير الصورة"`:""}>${im?"":NOPIC}</span>
      <div class="ct"><b>${esc(x.name)}</b>${x.code?`<small>الكود: <span class="cnum">${esc(x.code)}</span></small>`:""}</div>
      <span class="ca">${dsBtn(x)}<button class="btn ghost sm" data-e="${x.id}" aria-label="تعديل">${ib("edit","تعديل")}</button><button class="btn ghost sm dang" data-d="${x.id}" aria-label="حذف">${ib("trash","حذف")}</button></span></div>`}).join("")}</div>`:`<div class="empty">${Q?"مفيش نتائج":"القائمة فاضية. اضغط «إضافة»."}</div>`;
}
function addNames(){
  openModal("إضافة إلى "+NAMES[kind],`<label>اكتب اسم في كل سطر</label><textarea id="m-cn" rows="6" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)"></textarea>`,async()=>{
    const have=new Set(all.filter(x=>x.kind===kind).map(x=>norm(x.name))),add=[];
    document.getElementById("m-cn").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(n=>{const k=norm(n);if(!have.has(k)){have.add(k);add.push({kind,name:n})}});
    if(!add.length){toast("اكتب اسم جديد (الموجود قبل كده اتجاهل)");return false}
    const{error}=await db.from("catalog").insert(add);
    if(error){toast("خطأ: "+error.message);return false}
    await load();toast("تمت إضافة "+add.length);
  });
}
/* ===== نموذج مشترك: الاسم + الكود + الصورة ===== */
let newImg; // undefined = من غير تغيير | null = حذف الصورة | نص = صورة جديدة
const hasCode=()=>kind!=="code";
const LBLN={item:"اسم الصنف",color:"اسم اللون",code:"كود الرسمة"};
function entryForm(x){
  newImg=undefined;x=x||{};const im=safeAv(x.image);
  return `<label>${LBLN[kind]}</label><input id="c-name" maxlength="80" autocomplete="off" value="${esc(x.name||"")}">
    ${hasCode()?`<label>${kind==="item"?"كود الصنف":"كود اللون"} (اختياري)</label><input id="c-code" maxlength="40" dir="ltr" autocomplete="off" placeholder="مثال: P-100" value="${esc(x.code||"")}">`:""}
    <label>${kind==="code"?"صورة الرسمة":"الصورة"} (اختياري)</label>
    <div class="photoedit"><span class="cthumb ${im?"has":""}" id="c-prev" ${im?`style="background-image:url('${im}')"`:""}>${im?"":NOPIC}</span>
      <div class="pa"><button type="button" class="btn ghost sm" id="c-ph">اختيار صورة</button><button type="button" class="btn ghost sm" id="c-phx">حذف الصورة</button></div></div>
    <input type="file" id="c-file" accept="image/*" hidden><div class="hint">الصورة بتتصغّر وتتقصّ مربع تلقائيًا.</div>${kind==="item"?designPicker(x):""}`;
}
function designPicker(x){
  const codes=all.filter(k=>k.kind==="code"),have=new Set((x.designs||[]).map(norm));
  if(!codes.length)return`<label>الرسمات على الصنف</label><div class="hint">ضيف أكواد من تبويب «أكواد الزخرفة» الأول.</div>`;
  return`<label>الرسمات على الصنف (اختر أكتر من كود)</label><input id="c-dq" type="search" placeholder="بحث في الأكواد…" autocomplete="off">
    <div id="c-dl" class="dpick">${codes.map(k=>{const im=safeAv(k.image);return`<label class="dp" data-n="${esc(norm(k.name))}"><input type="checkbox" value="${esc(k.name)}" ${have.has(norm(k.name))?"checked":""}><span class="cthumb ${im?"has":""}" ${im?`style="background-image:url('${im}')"`:""}>${im?"":NOPIC}</span><b>${esc(k.name)}</b></label>`}).join("")}</div><div class="hint" id="c-dn"></div>`;
}
const readDesigns=()=>[...document.querySelectorAll("#c-dl input:checked")].map(i=>i.value);
function wireDesigns(){
  const l=document.getElementById("c-dl");if(!l)return;
  const n=()=>{document.getElementById("c-dn").textContent="المحدد: "+readDesigns().length};n();
  l.onchange=n;
  document.getElementById("c-dq").oninput=e=>{const q=norm(e.target.value);l.querySelectorAll(".dp").forEach(r=>r.style.display=!q||r.dataset.n.includes(q)?"":"none")};
}
function wireForm(){
  wireDesigns();
  const f=document.getElementById("c-file"),pv=document.getElementById("c-prev");
  const show=u=>{const im=safeAv(u);pv.className="cthumb"+(im?" has":"");pv.style.backgroundImage=im?`url('${im}')`:"";pv.innerHTML=im?"":NOPIC};
  document.getElementById("c-ph").onclick=()=>f.click();
  f.onchange=async()=>{try{newImg=await photoToData(f.files[0],240,.72);show(newImg)}catch(e){toast(e.message,"warn")}f.value=""};
  document.getElementById("c-phx").onclick=()=>{newImg=null;show(null)};
}
function addEntry(){
  openModal("إضافة · "+NAMES[kind],entryForm(),async()=>{
    const name=document.getElementById("c-name").value.trim(),code=hasCode()?document.getElementById("c-code").value.trim():"";
    if(!name){toast("اكتب الاسم");return false}
    if(all.some(x=>x.kind===kind&&norm(x.name)===norm(name))){toast("الاسم ده موجود بالفعل","warn");return false}
    const row={kind,name};if(code)row.code=code;if(newImg)row.image=newImg;
    const ds=kind==="item"?readDesigns():[];
    const{data:ins,error}=await db.from("catalog").insert(row).select("id").single();
    if(error){toast(/code|image|column/i.test(error.message||"")?NEED:"خطأ: "+error.message,"bad");return false}
    if(ds.length){const r=await db.rpc("catalog_set_designs",{p_id:ins.id,p_designs:ds});if(r.error){await load();toast(NEED2,"bad");return false}}
    await load();toast("تمت الإضافة");
  });
  wireForm();
}
function rename(id){
  const x=all.find(r=>r.id===id);
  openModal("تعديل · "+NAMES[kind],entryForm(x)+`<label>تطبيق تغيير الاسم على السجلات القديمة؟</label><select id="m-ap"><option value="1">نعم (الطلبيات والتقارير كلها)</option><option value="0">لا (القائمة فقط)</option></select>
    <div class="nums">لو كتبت اسم موجود، الاسمين بيتدمجوا في اسم واحد.</div>`,async()=>{
    const nn=document.getElementById("c-name").value.trim(),code=hasCode()?document.getElementById("c-code").value.trim():(x.code||"");
    if(!nn){toast("اكتب الاسم");return false}
    let msg="تم الحفظ",merged=false;
    if(nn!==x.name){
      const dup=all.find(r=>r.kind===kind&&r.id!==id&&norm(r.name)===norm(nn));
      if(dup&&!await ask("«"+dup.name+"» موجود بالفعل. تدمج الاسمين؟","نعم، ادمج"))return false;
      const{data,error}=await db.rpc("catalog_rename",{p_kind:kind,p_old:x.name,p_new:dup?dup.name:nn,p_apply:document.getElementById("m-ap").value==="1"});
      if(error){toast("خطأ: "+error.message);return false}
      msg=data;merged=!!dup;
    }
    if(!merged&&(code!==(x.code||"")||newImg!==undefined)){
      const r=await db.rpc("catalog_set_meta",{p_id:x.id,p_code:code,p_image:newImg===undefined?null:newImg,p_set_image:newImg!==undefined});
      if(r.error){toast(r.error.code==="PGRST202"||/code|image|column/i.test(r.error.message||"")?NEED:"خطأ: "+r.error.message,"bad");return false}
    }
    if(!merged&&kind==="item"){
      const nd=readDesigns(),od=(x.designs||[]);
      if(nd.length!==od.length||nd.some(n=>!od.some(o=>norm(o)===norm(n)))){
        const r=await db.rpc("catalog_set_designs",{p_id:x.id,p_designs:nd});
        if(r.error){toast(r.error.code==="PGRST202"||/designs|column/i.test(r.error.message||"")?NEED2:"خطأ: "+r.error.message,"bad");return false}
      }
    }
    if(!merged&&kind==="code"&&nn!==x.name){
      for(const it of all.filter(i=>i.kind==="item"&&(i.designs||[]).some(n=>norm(n)===norm(x.name)))){
        await db.rpc("catalog_set_designs",{p_id:it.id,p_designs:it.designs.map(n=>norm(n)===norm(x.name)?nn:n)});
      }
    }
    await load();toast(msg);
  });
  wireForm();
}
function zoom(x){
  const d=document.createElement("div");d.className="ov";d.style.zIndex=40;
  d.innerHTML=`<div class="modal"><h3>${esc(x.name)}${x.code?` · <span class="cnum">${esc(x.code)}</span>`:""}</h3><img class="zoomimg" alt="" src="${safeAv(x.image)}"><div class="row"><button class="btn ghost" id="zx" type="button" style="flex:1">إغلاق</button></div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="zx")d.remove()};
}
function showDesigns(x){
  const list=dsOf(x).map(n=>all.find(k=>k.kind==="code"&&norm(k.name)===norm(n))).filter(Boolean);
  const d=document.createElement("div");d.className="ov";d.style.zIndex=40;
  d.innerHTML=`<div class="modal"><h3>رسمات ${esc(x.name)}</h3><div class="cgrid" style="max-height:55vh;overflow:auto">${list.map(k=>{const im=safeAv(k.image);return`<div class="gc"><div class="gi ${im?"has":""}" ${im?`data-z="${k.id}" style="background-image:url('${im}')"`:""}>${im?"":NOPIC}</div><b>كود ${esc(k.name)}</b></div>`}).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="ds-sh" type="button" style="flex:1">${ib("share","مشاركة الصور")}</button><button class="btn ghost" id="ds-pdf" type="button" style="flex:1">${ib("download","PDF للعميل")}</button></div>
    <div class="row"><button class="btn ghost" id="zx" type="button" style="flex:1">${ib("x","إغلاق")}</button></div></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{
    if(e.target===d||e.target.closest("#zx"))return d.remove();
    const z=e.target.closest("[data-z]");if(z)return zoom(all.find(r=>r.id===+z.dataset.z));
    if(e.target.closest("#ds-pdf")){d.remove();buildPdf(list,{title:"رسمات "+x.name,note:"",cols:3,asCode:true})}
    if(e.target.closest("#ds-sh"))shareDesigns(x,list);
  };
}
async function shareDesigns(x,list){
  try{
    const files=[];
    for(const k of list){const im=safeAv(k.image);if(!im)continue;const b=await(await fetch(im)).blob();files.push(new File([b],"كود-"+k.name+".jpg",{type:b.type}))}
    const text=x.name+" — الرسمات: "+list.map(k=>k.name).join("، ");
    if(files.length&&navigator.canShare&&navigator.canShare({files}))await navigator.share({files,title:x.name,text});
    else if(navigator.share)await navigator.share({title:x.name,text});
    else toast("المشاركة مش مدعومة هنا، استخدم PDF","warn");
  }catch(e){if(e&&e.name!=="AbortError")toast("تعذّرت المشاركة، جرّب PDF","warn")}
}
document.getElementById("list").onclick=async e=>{
  const z=e.target.closest("[data-z]");if(z)return zoom(all.find(r=>r.id===+z.dataset.z));
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v)return showDesigns(all.find(r=>r.id===+b.dataset.v));
  if(b.dataset.e)return rename(+b.dataset.e);
  if(b.dataset.d){
    const x=all.find(r=>r.id===+b.dataset.d);
    if(!await ask("حذف «"+x.name+"» من القائمة؟ الطلبيات القديمة مش هتتأثر."))return;
    const{data,error}=await db.from("catalog").delete().eq("id",x.id).select();
    if(error||!data.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
    await load();toast("تم الحذف");
  }
};

/* ===== شريط العرض والتحديد + PDF للعميل ===== */
const rowsNow=()=>all.filter(x=>x.kind===kind&&hit(norm(Q),x.name,x.code||""));
function bar(rs){
  rs=rs||rowsNow();
  const v=document.getElementById("vw");v.textContent=view==="grid"?"عرض قائمة":"عرض معرض صور";
  const n=[...SEL].filter(id=>rs.some(x=>x.id===id)).length;
  document.getElementById("pdf").textContent=n?"PDF للعميل ("+nf(n)+" محدد)":"PDF للعميل (الكل)";
  document.getElementById("sa").textContent=n&&n===rs.length?"إلغاء التحديد":"تحديد الكل";
}
document.getElementById("vw").onclick=()=>{view=view==="grid"?"list":"grid";try{localStorage.setItem("catview",view)}catch(e){}draw()};
document.getElementById("sa").onclick=()=>{
  const rs=rowsNow(),all_=rs.every(x=>SEL.has(x.id));
  rs.forEach(x=>all_?SEL.delete(x.id):SEL.add(x.id));draw();
};
document.getElementById("list").addEventListener("change",e=>{
  const c=e.target.closest("[data-s]");if(!c)return;
  const id=+c.dataset.s;c.checked?SEL.add(id):SEL.delete(id);
  c.closest(".gc")?.classList.toggle("sel",c.checked);bar();
});
document.getElementById("pdf").onclick=()=>{
  const rs=rowsNow(),pick=rs.filter(x=>SEL.has(x.id)),use=pick.length?pick:rs;
  if(!use.length){toast("مفيش حاجة تتصدّر");return}
  const dt={item:"كتالوج الأصناف",color:"ألوان",code:"كتالوج الرسومات"}[kind];
  openModal("PDF للعميل · "+nf(use.length)+" عنصر",`<label>عنوان الملف</label><input id="p-t" maxlength="80" value="${esc(dt)}">
    <label>ملاحظة تحت العنوان (اختياري، زي رقم التواصل)</label><input id="p-n" maxlength="120" autocomplete="off">
    <label>عدد الصور في الصف</label><select id="p-c"><option value="2">2 (كبيرة)</option><option value="3" selected>3</option><option value="4">4 (صغيرة)</option></select>
    <div class="hint">هيفتح شاشة الطباعة، اختار منها «حفظ كـ PDF» وبعدها شاركه للعميل.</div>`,async()=>{
    const o={title:document.getElementById("p-t").value.trim()||dt,note:document.getElementById("p-n").value.trim(),cols:+document.getElementById("p-c").value};
    closeModal();await buildPdf(use,o);return false;
  },"إنشاء PDF");
};
async function buildPdf(rs,o){
  document.getElementById("pdfroot")?.remove();
  const d=document.createElement("div");d.id="pdfroot";
  const dt=new Date().toLocaleDateString("ar-EG",{year:"numeric",month:"long",day:"numeric"});
  d.innerHTML=`<div class="pdfph"><img src="logo-full.png" alt=""><div><h2>${esc(o.title)}</h2>${o.note?`<p>${esc(o.note)}</p>`:""}<small>${dt}</small></div></div>
  <div class="pdfpg c${o.cols}">${rs.map(x=>{const im=safeAv(x.image);
    return `<div class="pdfpc"><div class="pdfpi">${im?`<img src="${im}" alt="">`:""}</div><b>${esc(kind==="code"||o.asCode?"كود "+x.name:x.name)}</b>${x.code?`<small>الكود: ${esc(x.code)}</small>`:""}</div>`}).join("")}</div>`;
  document.body.appendChild(d);document.body.classList.add("pdfmode");
  try{await d.querySelector(".pdfph img").decode()}catch(e){}
  const done=()=>{document.body.classList.remove("pdfmode");d.remove();window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);
  setTimeout(()=>window.print(),200);
}
document.getElementById("add").onclick=addNames;
document.getElementById("addx").onclick=addEntry;
document.getElementById("q").oninput=e=>{Q=e.target.value;draw()};
document.querySelectorAll("#tb button").forEach(b=>b.onclick=()=>{
  kind=b.dataset.k;document.querySelectorAll("#tb button").forEach(x=>x.className="btn "+(x===b?"on":"ghost"));draw();
});
(async()=>{if(await requireAuth("catalog.html")){renderNav("catalog.html");load().finally(settle)}})();
</script>

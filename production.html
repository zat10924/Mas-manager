<script>
const SEC={
 glaze:{name:"جليز",color:"#2E6F80",o:"glaze_orders",l:"glaze_lines_status",p:"glaze_production",lab:x=>x.color},
 deco:{name:"زخرفة",color:"#5E5A8C",o:"deco_orders",l:"deco_lines_status",p:"deco_production",lab:x=>"كود "+x.code},
 spray:{name:"رش",color:"#B8862B"}};
/* صور أكواد الرسمات (زخرفة) */
let CIMG=new Map(),cimgAt=0;
async function loadCodeImgs(){
  if(CIMG.size&&Date.now()-cimgAt<120000)return;
  try{const r=await db.from("catalog").select("name,image").eq("kind","code").not("image","is",null);
    if(!r.error&&r.data){CIMG=new Map(r.data.map(x=>[norm(x.name),safeAv(x.image)]).filter(x=>x[1]));cimgAt=Date.now()}}catch(e){}
}
const cimg=c=>CIMG.get(norm(c))||"";
const cthumb=c=>{const u=cimg(c);return u?`<span class="dthumb" data-zc="${esc(c)}" style="background-image:url('${u}')" role="button" aria-label="تكبير صورة الرسمة"></span>`:""};
function zoomCode(c){
  const u=cimg(c);if(!u)return;
  const d=document.createElement("div");d.className="ov";d.style.zIndex=60;
  d.innerHTML=`<div class="modal"><h3>كود ${esc(c)}</h3><img class="zoomimg" alt="" src="${u}" style="max-height:70vh"><div class="row"><button class="btn ghost" id="zx" type="button" style="flex:1">إغلاق</button></div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="zx")d.remove()};
}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zc]");if(z){e.stopPropagation();zoomCode(z.dataset.zc)}},true);
let multi=false,sel=new Set(),selSec="",sec="",allowed=[],rows=[],tod=[],Q="",stale=0,D="";

async function load(){
  if(!D)D=today();
  if(sec==="deco")await loadCodeImgs();
  const c=SEC[sec],t=D;
  try{
    if(c.o){
      const[o,l,p]=await Promise.all([db.from(c.o).select("*"),db.from(c.l).select("*").order("id"),
        db.from(c.p).select("*").eq("prod_date",t).order("id",{ascending:false})]);
      if(o.error||l.error)throw new Error("load");
      const om=new Map(o.data.map(x=>[x.id,x])),lm=new Map(l.data.map(x=>[x.id,x]));
      rows=l.data.filter(x=>om.get(x.order_id)?.status==="open").map(x=>({id:x.id,oid:x.order_id,title:om.get(x.order_id).item,sub:c.lab(x),code:x.code,req:x.total_required,done:x.produced,date:om.get(x.order_id).order_date,due:om.get(x.order_id).due_date}));
      tod=(p.data||[]).map(e=>{const x=lm.get(e.line_id),o2=x&&om.get(x.order_id);return{k:"line",tb:c.p,id:e.id,qty:e.qty,date:e.prod_date,worker:e.worker||"",note:e.note||"",design:e.design||"",txt:o2?o2.item+" · "+c.lab(x):"—",max:x?x.total_required-x.produced+e.qty:0,sync:x?{lv:c.l,o:c.o,oid:x.order_id}:null}});
    }else{
      const[o,p]=await Promise.all([db.from("spray_status").select("*"),db.from("spray_production").select("*").eq("prod_date",t).order("id",{ascending:false})]);
      if(o.error)throw new Error("load");
      const om=new Map(o.data.map(x=>[x.id,x]));
      rows=o.data.filter(x=>x.status==="open").map(x=>({id:x.id,oid:x.id,title:x.item,sub:x.color,req:x.qty_required,done:x.produced,date:x.order_date}));
      tod=(p.data||[]).map(e=>{const x=om.get(e.order_id),sc=e.spray_color||"";return{k:"line",tb:"spray_production",id:e.id,qty:e.qty,date:e.prod_date,worker:e.worker||"",note:e.note||"",design:"",sc,txt:x?x.item+" · "+x.color+(sc?" · لون الرش: "+sc:""):"—",max:x?x.qty_required-x.produced+e.qty:0,sync:x?{sv:"spray_status",o:"spray_orders",oid:x.id}:null}});
    }
    // الإنتاج بدون طلبية (لو الجدول موجود)
    try{
      const f=await db.from("free_production").select("*").eq("section",sec).eq("prod_date",t).order("id",{ascending:false});
      if(!f.error)tod.unshift(...(f.data||[]).map(e=>({k:"free",tb:"free_production",id:e.id,qty:e.qty,date:e.prod_date,item:e.item,sub:e.sub||"",sc:e.spray_color||"",worker:e.worker||"",note:e.note||"",design:e.design||"",txt:e.item+(e.sub?" · "+e.sub:"")+(e.spray_color?" · لون الرش: "+e.spray_color:"")+" · بدون طلبية"})));
    }catch(e){}
    // سجل الهالك (جليز)
    if(sec==="glaze"){
      try{
        const w=await db.from("glaze_waste").select("*").gte("waste_date",t).lte("waste_date",t+"T23:59:59").order("id",{ascending:false});
        if(!w.error)tod.push(...(w.data||[]).map(e=>({k:"waste",tb:"glaze_waste",id:e.id,qty:+e.qty||0,good:+e.good_qty||0,date:String(e.waste_date||"").slice(0,10),item:e.item||"",reason:e.reason||"",worker:"",txt:"هالك · "+(e.item||"—")+" · سليم "+(+e.good_qty||0)+(e.reason?" · "+e.reason:"")})));
      }catch(x){}
    }
    try{localStorage.setItem("pc_"+sec,JSON.stringify({rows,tod,at:Date.now()}))}catch(e){}
    stale=0;
  }catch(e){
    let ch=null;try{ch=JSON.parse(localStorage.getItem("pc_"+sec))}catch(x){}
    if(!ch){fail("list",load);return}
    rows=ch.rows;tod=D===today()?ch.tod:[];stale=ch.at;
  }
  // التسجيلات اللي لسه ما اتبعتتش بتتحسب في الأرقام
  Q_.get().filter(i=>i.sec===sec).forEach(i=>{const r=rows.find(x=>x.id===i.rid);if(r)r.done+=i.qty;if((i.row&&i.row.prod_date||today())===D)tod.unshift({qty:i.qty,txt:i.txt+" ⏳",pend:1})});
  draw();
}
function draw(){
  const c=SEC[sec],q=Q.trim().toLowerCase();
  if(selSec!==sec){sel.clear();selSec=sec}
  const list=rows.filter(r=>!q||(r.title+" "+r.sub).toLowerCase().includes(q)).sort((a,b)=>String(a.due||a.date).localeCompare(String(b.due||b.date)));
  kpis("stats",[["بنود مفتوحة",rows.length],["المتبقي",rows.reduce((a,r)=>a+Math.max(r.req-r.done,0),0)],[D===today()?"إنتاج النهارده":"إنتاج اليوم",tod.filter(e=>e.k!=="waste").reduce((a,e)=>a+e.qty,0),"var(--ok)"]]);
  document.getElementById("list").innerHTML=list.length?list.map(r=>{
    const rem=Math.max(r.req-r.done,0),p=r.req>0?Math.min(100,Math.round(r.done/r.req*100)):0,late=r.due?today()>r.due:isLate("open",r.date);
    return `<div class="card pr ${multi&&sel.has(r.id)?"sel":""}" data-id="${r.id}" style="cursor:pointer"><div class="top"><span style="display:flex;gap:8px;align-items:center;min-width:0">${multi?`<span class="ck ${sel.has(r.id)?"on":""}"></span>`:""}${sec==="deco"?cthumb(r.code):""}<b>${esc(r.title)}</b></span><span>${late?'<span class="tag late">متأخرة</span> ':""}<span class="tag">${esc(r.sub)}</span></span></div>
      <div class="bar"><i style="width:${p}%"></i></div><div class="nums">تم <b>${nf(r.done)}</b> من <b>${nf(r.req)}</b> · متبقي <b>${nf(rem)}</b></div></div>`}).join(""):`<div class="empty">${q?"مفيش نتائج":"مفيش بنود مفتوحة"}</div>`;
  document.querySelectorAll(".pr").forEach(e=>e.onclick=()=>pick(rows.find(r=>String(r.id)===e.dataset.id),e));
  updBar();
  wasteBtn.hidden=sec!=="glaze";
  if(stale)document.getElementById("list").insertAdjacentHTML("afterbegin",`<div class="card" style="border-color:var(--warn)"><b class="ibt">${ui("wifioff")}لا يوجد اتصال</b><div class="nums">بيانات محفوظة من آخر اتصال (${new Date(stale).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}). تسجيلاتك هتتحفظ وتتبعت لما النت يرجع.</div></div>`);
  const ce=can("edit")&&!stale,cd=can("delete")&&!stale;
  document.getElementById("logh").textContent=D===today()?"تسجيلات النهارده":"تسجيلات يوم "+fmtD(D);
  document.getElementById("logd").value=D;
  document.getElementById("today").innerHTML=tod.length?`<div class="card">${tod.map((e,i)=>`<div class="line fe"><span>${esc(e.txt)}${e.worker?` <span class="nums">· ${esc(e.worker)}</span>`:""}</span><span style="display:flex;align-items:center;gap:6px"><b${e.k==="waste"?' style="color:var(--bad,#c0392b)"':""}>${nf(e.qty)}</b>${e.k&&!e.pend&&ce?`<button class="btn ghost sm" type="button" onclick="editEnt(${i})">تعديل</button>`:""}${e.k&&!e.pend&&cd?`<button class="btn ghost sm" type="button" onclick="delEntry(${i})">حذف</button>`:""}</span></div>`).join("")}</div>`:`<div class="empty">${D===today()?"لسه مفيش تسجيل النهارده":"مفيش تسجيل في اليوم ده"}</div>`;
}
// ===== تحديد متعدد: تسجيل إنتاج أكتر من بند في مرة واحدة =====
function updBar(){
  mbtn.innerHTML=multi?ib("x","إنهاء التحديد"):ib("checksq","تحديد متعدد");mall.hidden=!multi;
  mbar.hidden=!multi;mgo.textContent=sel.size?"تسجيل "+sel.size+" بند":"اختر البنود";mgo.disabled=!sel.size;
}
function pick(r,el){
  if(!r)return;
  if(!multi)return quick(r);
  if(r.req-r.done<=0){toast("البند ده مكتمل بالفعل","warn");return}
  sel.has(r.id)?sel.delete(r.id):sel.add(r.id);
  el.classList.toggle("sel",sel.has(r.id));const k=el.querySelector(".ck");if(k)k.classList.toggle("on",sel.has(r.id));
  updBar();
}
async function saveOne(r,q,d,sc){
  const c=SEC[sec],id=uuid(),tb=c.p||"spray_production";
  const row=c.p?{line_id:r.id,qty:q,prod_date:d,client_id:id}:{order_id:r.id,qty:q,prod_date:d,client_id:id,spray_color:sc};
  const it={id,table:tb,row,sec,rid:r.id,qty:q,txt:r.title+" · "+r.sub,sync:c.o?{lv:c.l,o:c.o,oid:r.oid}:{sv:"spray_status",o:"spray_orders",oid:r.id}};
  let res;try{res=await insertRow(tb,row)}catch(e){res={error:{message:String(e)}}}
  if(res.error&&isNet(res.error)){Q_.add(it);updateBadge();return{off:1}}
  if(res.error)return{err:res.error.message};
  return{done:await syncAfter(it)};
}
function multiModal(){
  const items=rows.filter(r=>sel.has(r.id)&&r.req-r.done>0);
  if(!items.length)return;
  openModal("تسجيل "+items.length+" بند",`<label>التاريخ</label><input type="date" id="m-d" value="${today()}">`+items.map(r=>{
    const rem=r.req-r.done;
    return `<div class="line"><div class="r"><span style="display:flex;gap:8px;align-items:center">${sec==="deco"?cthumb(r.code):""}<b>${esc(r.title)}</b></span><span class="tag">${esc(r.sub)}</span></div>
      <div class="nums">تم <b>${nf(r.done)}</b> من <b>${nf(r.req)}</b> · المتبقي <b>${nf(rem)}</b></div>
      <div class="row" style="flex-wrap:nowrap;margin-top:6px"><input type="number" class="mq" data-id="${r.id}" min="1" inputmode="numeric" placeholder="الكمية" style="margin:0"><button type="button" class="btn ghost sm" onclick="this.previousElementSibling.value=${rem}">الكل (${rem})</button></div>${sec==="spray"?`<label style="margin-top:6px">لون الرش</label><input class="msc" data-id="${r.id}" data-kind="color" value="" placeholder="لون الرش" autocomplete="off" maxlength="60" style="margin:0">`:""}</div>`}).join(""),async()=>{
    const d=document.getElementById("m-d").value||today(),todo=[];
    for(const r of items){
      const v=document.querySelector('.mq[data-id="'+r.id+'"]').value.trim();if(!v)continue;
      const q=parseInt(v),rem=r.req-r.done;
      if(!q||q<1){toast("كمية غلط في: "+r.title+" · "+r.sub);return false}
      const sc=sec==="spray"?((document.querySelector('.msc[data-id="'+r.id+'"]')||{}).value||"").trim():"";
      if(sec==="spray"&&!sc){toast("اكتب لون الرش في: "+r.title+" · "+r.sub);return false}
      todo.push([r,q,sc]);
    }
    if(!todo.length){toast("اكتب كمية لبند واحد على الأقل");return false}
    if(!await reviewSave({title:"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(d)]],
      items:todo.map(([r,q,sc])=>({title:r.title,rows:[[sec==="deco"?"كود الرسمة":"اللون",r.sub],["الكمية",nf(q)],["المتبقي بعد التسجيل",remAfter(r.req-r.done,q)],...(sc?[["لون الرش",sc]]:[])],warn:overWarn(r.req-r.done,q)})),
      total:todo.reduce((a,t)=>a+t[1],0)}))return false;
    const overN=todo.filter(([r,q])=>q>r.req-r.done).length;
    let ok=0,off=0,fin=0;const bad=[];
    for(const[r,q,sc]of todo){const x=await saveOne(r,q,d,sc);if(x.err)bad.push(r.title+" · "+r.sub+": "+x.err);else{ok++;if(x.off)off++;if(x.done)fin++}}
    multi=false;sel.clear();await load();
    if(bad.length)toast("اتسجل "+ok+" وفشل "+bad.length+": "+bad[0]);
    else if(off)toast("مفيش نت: اتحفظ "+ok+" بند على الجهاز وهيتسجلوا لما النت يرجع","warn");
    else if(overN)toast("تم تسجيل "+ok+" بند"+(fin?" — اكتملت "+fin+" طلبية":"")+" — تنبيه: "+overN+" بند أعلى من المتبقي","warn");
    else toast("تم تسجيل "+ok+" بند"+(fin?" — اكتملت "+fin+" طلبية":""));
  },"تسجيل الكل");
}
mbtn.onclick=()=>{multi=!multi;sel.clear();draw()};
freeBtn.onclick=()=>freeProduction(sec,load);
wasteBtn.onclick=()=>quickWaste(load);
// ===== تعديل / حذف تسجيل إنتاج اتسجّل بالغلط =====
async function resync(e){
  const x=e.sync;if(!x)return;
  if(x.lv){await syncAfter(e);return}
  const{data}=await db.from(x.sv).select("*").eq("id",x.oid).single();
  const done=!!data&&data.produced>=data.qty_required;
  if(data&&data.status!==(done?"done":"open"))await db.from(x.o).update({status:done?"done":"open"}).eq("id",x.oid);
}
async function delEntry(i){
  const e=tod[i];if(!e||!e.k||e.pend)return;
  if(!await ask((e.k==="waste"?"حذف تسجيل الهالك ده؟ (":"حذف تسجيل الإنتاج ده؟ (")+esc(e.txt)+")"))return;
  const{data:dd,error}=await db.from(e.tb).delete().eq("id",e.id).select();
  if(error||!dd.length){toast(error?(isNet(error)?"الحذف محتاج اتصال بالإنترنت":"خطأ: "+error.message):"لم يتم الحذف، راجع الصلاحيات","bad");return}
  await resync(e);await load();toast("تم الحذف");
}
function editWaste(e){
  openModal("تعديل هالك",`<label>الصنف</label><input id="m-item" value="${esc(e.item)}" autocomplete="off">
    <div class="two"><div><label>الكمية السليمة</label><input type="number" id="m-g" min="0" inputmode="numeric" value="${e.good}"></div><div><label>الكمية الهالكة</label><input type="number" id="m-q" min="0" inputmode="numeric" value="${e.qty}"></div></div>
    <label>التاريخ</label><input type="date" id="m-d" value="${e.date||today()}">
    <label>السبب (اختياري)</label><input id="m-r" value="${esc(e.reason)}" autocomplete="off">`,async()=>{
    const item=document.getElementById("m-item").value.trim(),g=parseInt(document.getElementById("m-g").value)||0,q=parseInt(document.getElementById("m-q").value)||0;
    if(!item){toast("اكتب الصنف");return false}
    if(g+q<=0){toast("اكتب الكمية السليمة والهالكة");return false}
    const r=await db.from("glaze_waste").update({item,waste_date:document.getElementById("m-d").value||today(),good_qty:g,qty:q,reason:document.getElementById("m-r").value.trim()||null}).eq("id",e.id).select();
    if(r.error){toast(isNet(r.error)?"التعديل محتاج اتصال بالإنترنت":"خطأ: "+r.error.message,"bad");return false}
    if(!r.data||!r.data.length){toast("لم يتم التعديل، راجع الصلاحيات","bad");return false}
    await load();toast("تم التعديل");
  },"حفظ التعديل");
}
function editEnt(i){
  const e=tod[i];if(!e||!e.k||e.pend)return;
  if(e.k==="waste")return editWaste(e);
  const deco=sec==="deco",free=e.k==="free",lab=deco?"كود الرسمة":sec==="spray"?"لون الصنف":"اللون",sid=deco?"m-code":"m-color",sprayLine=sec==="spray";
  openModal("تعديل تسجيل الإنتاج",
    (free?`<label>الصنف</label><input id="m-item" autocomplete="off"><label>${lab} (اختياري)</label><input id="${sid}" autocomplete="off">`
         :`<div class="nums"><b>${esc(e.txt)}</b></div>`)+
    `<label>الكمية</label><input type="number" id="m-q" min="1" inputmode="numeric" value="${e.qty}">`+
    (e.max?`<div class="hint" style="margin:0">المتاح للبند ده: ${nf(e.max)} (لو زدت عنه هيتسجل مع تنبيه)</div>`:"")+
    `<label>التاريخ</label><input type="date" id="m-d" value="${e.date||today()}">${sprayLine?XS(e.sc):""}${XF(deco)}`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    const v=id=>((document.getElementById(id)||{}).value||"").trim();
    const d=v("m-d")||e.date||today();
    const patch={qty:q,prod_date:d,worker:v("m-w")||null,note:v("m-n")||null};
    if(deco)patch.design=v("m-ds")||null;
    if(sprayLine)patch.spray_color=v("m-sc")||null;
    if(sprayLine&&!v("m-sc")){toast("اكتب لون الرش");return false}
    if(free){const item=v("m-item");if(!item){toast("اكتب الصنف");return false}patch.item=item;patch.sub=v(sid)||null}
    let r=await db.from(e.tb).update(patch).eq("id",e.id).select();
    if(r.error&&/worker|note|design|spray_color/.test(r.error.message||"")){const{worker,note,design,spray_color,...rest}=patch;r=await db.from(e.tb).update(rest).eq("id",e.id).select()}
    if(r.error){toast(isNet(r.error)?"التعديل محتاج اتصال بالإنترنت":"خطأ: "+r.error.message,"bad");return false}
    if(!r.data||!r.data.length){toast("لم يتم التعديل، راجع الصلاحيات","bad");return false}
    await resync(e);await load();
    if(e.max&&q>e.max){toast("تم التعديل — تنبيه: الكمية أعلى من المتاح بـ "+nf(q-e.max),"warn");return}
    toast(d!==D?"تم التعديل — التسجيل اتنقل ليوم "+fmtD(d):"تم التعديل");
  },"حفظ التعديل");
  const set=(id,val)=>{const el=document.getElementById(id);if(el&&val)el.value=val};
  if(free){set("m-item",e.item);set(sid,e.sub)}
  set("m-w",e.worker);set("m-n",e.note);set("m-ds",e.design);
}
mall.onclick=()=>{const q=Q.trim().toLowerCase();rows.filter(r=>r.req-r.done>0&&(!q||(r.title+" "+r.sub).toLowerCase().includes(q))).forEach(r=>sel.add(r.id));draw()};
mx.onclick=()=>{multi=false;sel.clear();draw()};
mgo.onclick=multiModal;
logd.onchange=()=>{D=logd.value||today();skel("today",1);load()};
function quick(r){
  if(r&&typeof r!=="object")r=rows.find(x=>String(x.id)===String(r));
  if(!r||!(r.req>=0)||typeof r.sub==="function"){toast("البند ده مش متحمّل صح — دوس «تحديث» وجرّب تاني","warn");return}
  const rem=r.req-r.done;
  if(rem<=0){toast("البند ده مكتمل بالفعل","warn");return}
  const lk="lq_"+sec+"_"+r.id;let last=0;try{last=+localStorage.getItem(lk)||0}catch(e){}
  const chips=[10,25,50,100].filter(n=>n<rem).map(n=>[n,"+"+n]).concat([[rem,"الكل ("+rem+")"]]);
  if(last&&last<=rem&&!chips.some(c=>c[0]===last))chips.unshift([last,"آخر مرة ("+last+")"]);
  openModal(`${esc(r.title)} · ${esc(r.sub)}`,`${sec==="deco"&&cimg(r.code)?`<img class="dzoom" alt="" src="${cimg(r.code)}" data-zc="${esc(r.code)}">`:""}<div class="nums">المتبقي: <b>${nf(rem)}</b></div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin:8px 0">${chips.map(c=>`<button type="button" class="btn ghost sm" onclick="document.getElementById('m-q').value=${c[0]}">${c[1]}</button>`).join("")}</div>
    <label>الكمية</label><input type="number" id="m-q" min="1" inputmode="numeric"><label>التاريخ</label><input type="date" id="m-d" value="${today()}">${sec==="spray"?XS(""):""}${XF(sec==="deco")}`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    const c=SEC[sec],d=document.getElementById("m-d").value||today(),id=uuid(),tb=c.p||"spray_production";
    const xr=xfRead();if(sec==="spray"&&!xr.spray_color){toast("اكتب لون الرش");return false}
    if(!await reviewSave({title:"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(d)],...rvFields(xr)],
      items:[{title:r.title,rows:[[sec==="deco"?"كود الرسمة":"اللون",r.sub],["الكمية",nf(q)],["المتبقي بعد التسجيل",remAfter(rem,q)]],warn:overWarn(rem,q)}]}))return false;
    const row={...(c.p?{line_id:r.id,qty:q,prod_date:d,client_id:id}:{order_id:r.id,qty:q,prod_date:d,client_id:id}),...xr};
    const it={id,table:tb,row,sec,rid:r.id,qty:q,txt:r.title+" · "+r.sub,sync:c.o?{lv:c.l,o:c.o,oid:r.oid}:{sv:"spray_status",o:"spray_orders",oid:r.id}};
    let res;try{res=await insertRow(tb,row)}catch(e){res={error:{message:String(e)}}}
    if(res.error&&isNet(res.error)){
      Q_.add(it);updateBadge();try{localStorage.setItem(lk,q)}catch(e){}
      await load();toast("مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع","warn");return;
    }
    if(res.error){toast("خطأ: "+res.error.message);return false}
    try{localStorage.setItem(lk,q)}catch(e){}
    const done=await syncAfter(it);
    await load();if(q>rem)overToast(1,q-rem);else toast(done?"اكتملت الطلبية":"تم التسجيل");
  });
}
function secs(){
  document.getElementById("secs").innerHTML=allowed.map(k=>`<button class="btn ${k===sec?"on":"ghost"}" data-s="${k}">${SEC[k].name}</button>`).join("");
  document.querySelectorAll("#secs button").forEach(b=>b.onclick=()=>{sec=b.dataset.s;history.replaceState(null,"","#"+sec);secs();skel("list",3);load()});
}
(async()=>{if(await requireAuth("production.html")){
  allowed=ME.role==="admin"?["glaze","deco","spray"]:mySecs().filter(k=>SEC[k]);
  renderNav("production.html");
  if(!allowed.length){document.querySelector(".prodact").hidden=true;document.getElementById("list").innerHTML='<div class="empty">تسجيل التصليح من صفحة التصليح</div>';settle();return}
  const h=location.hash.slice(1);sec=allowed.includes(h)?h:allowed[0];
  secs();searchBox("list",q=>{Q=q;draw()});skel("list",3);load().finally(settle)}})();
</script>

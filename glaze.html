  <h1>جليز</h1>
  <div class="tabs noprint">
    <button class="btn on" id="t-open">مفتوحة</button>
    <button class="btn ghost" id="t-done">مكتملة</button>

  </div>
  <div id="ordersView">
    <div class="row" style="margin:0 0 12px"><button class="btn" id="newOrder" style="flex:1">+ طلبية جديدة</button><button class="btn ghost" id="newWaste" style="flex:1">تسجيل هالك</button></div>
  <div class="row noprint" id="freeRow" style="margin:-4px 0 12px"><button class="btn ghost" id="freeBtn" type="button" style="flex:1">＋ إنتاج بدون طلبية</button></div>

      <div class="row"><button class="btn" id="f-go">عرض</button><button class="btn ghost" id="f-csv">تصدير Excel</button><button class="btn ghost" onclick="window.print()">طباعة</button></div>

<script>
let orders=[],lines=[],tab=location.hash==="#reports"?"prod":"open",wRows=[],Q="",repCtl=null;

async function load(){
  const[o,l,pr,ft]=await Promise.all([
    db.from("glaze_orders").select("*").order("created_at",{ascending:false}),
    db.from("glaze_lines_status").select("*").order("id"),
    db.from("glaze_production").select("id,line_id,qty,prod_date").order("prod_date",{ascending:false}).order("id",{ascending:false}),
    freeTodayQty("glaze")
  ]);
  if(o.error||l.error){fail("orders",load);return}
  FREE_T=ft;orders=o.data;lines=l.data;prods=pr.data||[];renderOrders();
}

let prods=[];
function logHtml(id){
  const p=prods.filter(x=>x.line_id===id);
  if(!p.length)return"";
  return '<div class="nums" style="font-size:.85rem">'+p.slice(0,6).map(e=>`${e.qty} (${fmtD(e.prod_date)})`).join(" · ")+(p.length>6?` · +${p.length-6}`:"")+"</div>";
}
async function editOrder(id){
  const o=orders.find(x=>x.id===id);
  const{data:ol,error:le}=await db.from("glaze_order_lines").select("id,color,qty_required").eq("order_id",id).order("id");
  if(le){toast("خطأ: "+le.message);return}
  const row=l=>`<div class="two nr" data-id="${l?l.id:""}"><input class="c" placeholder="اللون" value="${esc(l?l.color:"")}"><input class="q" type="number" min="1" inputmode="numeric" placeholder="الكمية" value="${l?l.qty_required:""}"></div>`;
  openModal("تعديل الطلبية",`<label>الصنف</label><input id="m-item" value="${esc(o.item)}"><label>تاريخ الطلبية</label><input type="date" id="m-od" value="${o.order_date||today()}"><label>تاريخ التسليم (اختياري)</label><input type="date" id="m-due" value="${o.due_date||''}">
    <label>الألوان والكميات المطلوبة</label><div id="m-rows">${(ol||[]).map(row).join("")}</div>
    <button class="btn ghost sm" id="m-addc" type="button" style="width:100%;margin-top:6px">+ لون جديد</button>
    <div class="hint">غيّر الاسم أو الكمية مباشرة، أو أضف جديد. للحذف أو سجل الإنتاج استخدم «تعديل / سجل» تحت كل بند.</div>`,async()=>{
    const item=document.getElementById("m-item").value.trim();
    if(!item){toast("اكتب الصنف");return false}
    const rs=[...document.querySelectorAll("#m-rows .nr")].map(r=>({id:r.dataset.id?+r.dataset.id:null,color:r.querySelector(".c").value.trim(),qty:parseInt(r.querySelector(".q").value)}));
    const fresh=rs.filter(r=>!r.id&&(r.color||r.qty));
    if(rs.some(r=>r.id&&(!r.color||!(r.qty>0)))||fresh.some(r=>!r.color||!(r.qty>0))){toast("كمّل الاسم والكمية في كل بند");return false}
    let e=(await db.from("glaze_orders").update({item,order_date:document.getElementById("m-od").value||today(),due_date:document.getElementById("m-due").value||null}).eq("id",id)).error;
    if(e){toast("خطأ: "+e.message);return false}
    const old=new Map((ol||[]).map(l=>[l.id,l]));
    for(const r of rs.filter(r=>r.id)){
      const b=old.get(r.id);if(!b||(b.color===r.color&&b.qty_required===r.qty))continue;
      e=(await db.from("glaze_order_lines").update({color:r.color,qty_required:r.qty}).eq("id",r.id)).error;
      if(e){toast("خطأ: "+e.message);return false}
    }
    if(fresh.length){
      e=(await db.from("glaze_order_lines").insert(fresh.map(r=>({order_id:id,color:r.color,qty_required:r.qty})))).error;
      if(e){toast("خطأ: "+e.message);return false}
    }
    await syncStatus(id);await load();toast(fresh.length?"تم التعديل وإضافة "+fresh.length+" لون جديد":"تم التعديل");
  });
  document.getElementById("m-addc").onclick=()=>{
    const box=document.getElementById("m-rows");box.insertAdjacentHTML("beforeend",row(null));
    const nr=box.lastElementChild;try{attachLists(nr)}catch(x){}nr.querySelector(".c").focus();
  };
}
function postpone(id){postponeOrder("glaze","glaze_orders",orders.find(x=>x.id===id),load)}
function drawStats(){
  const open=orders.filter(o=>o.status==="open"),ids=new Set(open.map(o=>o.id)),t=today();
  kpis("stats",[["طلبيات مفتوحة",open.length],["المتبقي للإنجاز",lines.filter(l=>ids.has(l.order_id)).reduce((a,l)=>a+Math.max(l.total_required-l.produced,0),0)],["إنتاج النهارده",prods.filter(p=>p.prod_date===t).reduce((a,p)=>a+p.qty,0)+FREE_T,"var(--ok)"]]);
}
function renderOrders(){
  drawStats();
  const list=orders.filter(o=>o.status===tab&&hit(Q,o.item,...lines.filter(x=>x.order_id===o.id).map(x=>x.color)));
  const box=document.getElementById("orders");
  if(!list.length){box.innerHTML=`<div class="empty">${Q?"مفيش نتائج للبحث":tab==="open"?"مفيش طلبيات مفتوحة. اضغط «طلبية جديدة».":"مفيش طلبيات مكتملة."}</div>`;return}
  box.innerHTML=list.map(o=>{
    const ls=lines.filter(x=>x.order_id===o.id);
    const done=o.status==="done";
    return `<div class="card ${done?"done":""}">
      <div class="top"><b>${esc(o.item)}</b><span>${lateOrder(o)?'<span class="tag late">متأخرة</span> ':""}<span class="tag ${done?"ok":""}">${done?"مكتملة":"مفتوحة"}</span></span></div>
      <div class="nums">${dueTag(o)}${o.postponed_count?` <span class="tag">اتأجلت ${o.postponed_count} مرة</span>`:""}</div>
      <div class="nums">تاريخ الطلبية: <b>${fmtD(o.order_date)}</b>${done?"":` · ${ageTxt(o.order_date)}`}</div>
      ${done?'<div class="banner ibt">'+ui("checkc")+'<span>اكتملت الطلبية</span></div>':""}
      ${ls.map(x=>{
        const rem=Math.max(x.total_required-x.produced,0),pct=Math.min(100,Math.round(x.produced/x.total_required*100));
        return `<div class="line ${rem===0?"full":""}">
          <div class="r"><b>${esc(x.color)}</b>
          <span class="nums">مطلوب <b>${x.total_required}</b> · تم <b>${x.produced}</b> · متبقي <b>${rem}</b></span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          ${logHtml(x.id)}
          <div class="row" style="margin-top:4px">${rem>0?`<button class="btn sm" onclick="produce(${x.id})">تسجيل إنتاج</button>`:""}<button class="btn ghost sm" onclick="lineDetails(${x.id})">تعديل / سجل</button></div>
        </div>`}).join("")}
      <div class="row">
        <button class="btn ghost sm" onclick="increase(${o.id})">زيادة الطلبية</button>
        <button class="btn ghost sm" onclick="delOrder(${o.id})">حذف الطلبية</button><button class="btn ghost sm" onclick="editOrder(${o.id})">تعديل الطلبية</button>${done?"":`<button class="btn ghost sm" onclick="postpone(${o.id})">تأجيل</button>`}
      </div></div>`;
  }).join("");
}

async function syncStatus(orderId){
  const{data}=await db.from("glaze_lines_status").select("*").eq("order_id",orderId);
  const done=data.length>0&&data.every(x=>x.produced>=x.total_required);
  const o=orders.find(x=>x.id===orderId);
  const st=done?"done":"open";
  if(o&&o.status!==st){await db.from("glaze_orders").update({status:st}).eq("id",orderId)}
  return done;
}

function produce(lineId){
  const x=lines.find(l=>l.id===lineId),rem=x.total_required-x.produced;
  openModal(`إنتاج ${esc(x.color)}`,`<div class="nums">المتبقي: <b>${rem}</b></div><label>الكمية اللي خلصتها</label><input type="number" id="m-q" min="1" max="${rem}" inputmode="numeric"><label>التاريخ</label><input type="date" id="m-d" value="${today()}">${XF()}`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    if(q>rem){toast("الكمية أكبر من المتبقي ("+rem+")");return false}
    const pd=document.getElementById("m-d").value||today(),xr=xfRead(),po=orders.find(o=>o.id===x.order_id);
    if(!await reviewSave({title:"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(pd)],...rvFields(xr)],items:[{title:po?po.item:"",rows:[["اللون",x.color],["الكمية",nf(q)],["المتبقي بعد التسجيل",nf(rem-q)]]}]}))return false;
    const{error}=await insertRow("glaze_production",{line_id:lineId,qty:q,prod_date:pd,...xr});
    if(error){toast("خطأ: "+error.message);return false}
    const done=await syncStatus(x.order_id);
    await load();
    toast(done?"اكتملت الطلبية":"تم التسجيل");
  });
}

async function lineDetails(lineId){
  const x=lines.find(l=>l.id===lineId);
  const[p,i,l]=await Promise.all([
    db.from("glaze_production").select("*").eq("line_id",lineId).order("prod_date",{ascending:false}),
    db.from("glaze_order_increases").select("*").eq("line_id",lineId).order("created_at",{ascending:false}),
    db.from("glaze_order_lines").select("qty_required").eq("id",lineId).single()
  ]);
  const ent=(t,r)=>(r.data||[]).length?r.data.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span><b>${e.qty}</b> <span class="nums">${fmtD(e.prod_date||e.created_at.slice(0,10))}</span></span><button class="btn ghost sm" onclick="delEntry('${t}',${e.id},${lineId})">حذف</button></div>`).join(""):'<div class="nums">لا يوجد</div>';
  openModal("تعديل اللون "+esc(x.color),`<label>اللون</label><input id="m-name" value="${esc(x.color)}">
    <label>الكمية الأصلية المطلوبة</label><input type="number" id="m-req" min="1" inputmode="numeric" value="${l.data?l.data.qty_required:""}">
    <h3>سجل الإنتاج</h3>${ent("glaze_production",p)}
    <h3 style="margin-top:12px">سجل الزيادات</h3>${ent("glaze_order_increases",i)}
    <div class="row"><button class="btn ghost sm" onclick="delLine(${lineId})">حذف اللون</button></div>`,async()=>{
    const c=document.getElementById("m-name").value.trim(),q=parseInt(document.getElementById("m-req").value);
    if(!c||!(q>0)){toast("كمّل البيانات");return false}
    const{error}=await db.from("glaze_order_lines").update({color:c,qty_required:q}).eq("id",lineId);
    if(error){toast("خطأ: "+error.message);return false}
    await syncStatus(x.order_id);await load();toast("تم التعديل");
  });
}
async function delEntry(t,id,lineId){
  if(!await ask("حذف السجل ده؟"))return;
  const oid=lines.find(l=>l.id===lineId).order_id;
  const{data:dd,error}=await db.from(t).delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await syncStatus(oid);await load();lineDetails(lineId);
}
async function delLine(lineId){
  if(!await ask("حذف اللون وكل سجلاته؟"))return;
  const oid=lines.find(l=>l.id===lineId).order_id;
  const{data:dd,error}=await db.from("glaze_order_lines").delete().eq("id",lineId).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  closeModal();await syncStatus(oid);await load();toast("تم الحذف");
}
async function delOrder(id){
  if(!await ask("حذف الطلبية بكل بياناتها؟"))return;
  const{data:dd,error}=await db.from("glaze_orders").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}

function increase(orderId){
  const ls=lines.filter(l=>l.order_id===orderId);
  openModal("زيادة الطلبية",`<label>اللون</label><select id="m-line">${ls.map(l=>`<option value="${l.id}">${esc(l.color)}</option>`).join("")}<option value="new">+ لون جديد</option></select>
    <div id="m-newc" style="display:none"><label>اسم اللون الجديد</label><input id="m-color"></div>
    <label>الكمية المضافة</label><input type="number" id="m-q" min="1" inputmode="numeric">`,async()=>{
    const q=parseInt(document.getElementById("m-q").value),v=document.getElementById("m-line").value;
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    let r;
    if(v==="new"){
      const c=document.getElementById("m-color").value.trim();
      if(!c){toast("اكتب اسم اللون");return false}
      r=await db.from("glaze_order_lines").insert({order_id:orderId,color:c,qty_required:q});
    }else r=await db.from("glaze_order_increases").insert({line_id:parseInt(v),qty:q});
    if(r.error){toast("خطأ: "+r.error.message);return false}
    await syncStatus(orderId);await load();toast("تمت الزيادة");
  });
  document.getElementById("m-line").onchange=e=>document.getElementById("m-newc").style.display=e.target.value==="new"?"block":"none";
}

function waste(orderId,rec){
  const o=orders.find(x=>x.id===orderId);
  const items=[...new Set(orders.map(x=>x.item))];
  openModal(rec?"تعديل هالك":"تسجيل هالك بسكوت",`<label>الصنف</label><input id="m-item" list="m-items" value="${esc(rec?rec.item:(o?o.item:""))}"><datalist id="m-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <div class="two"><div><label>الكمية السليمة</label><input type="number" id="m-g" min="0" inputmode="numeric" value="${rec?rec.good:""}"></div><div><label>الكمية الهالكة</label><input type="number" id="m-q" min="0" inputmode="numeric" value="${rec?rec.qty:""}"></div></div>
    <div class="nums" id="m-pct"></div>
    <label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.d:today()}">
    <label>السبب (اختياري)</label><input id="m-r" value="${esc(rec?rec.reason:"")}">`,async()=>{
    const item=document.getElementById("m-item").value.trim();
    const g=parseInt(document.getElementById("m-g").value)||0,q=parseInt(document.getElementById("m-q").value)||0;
    if(!item){toast("اكتب الصنف");return false}
    if(g+q<=0){toast("اكتب الكمية السليمة والهالكة");return false}
    const row={item,waste_date:document.getElementById("m-d").value||today(),good_qty:g,qty:q,reason:document.getElementById("m-r").value.trim()||null};
    const{error}=rec?await db.from("glaze_waste").update(row).eq("id",rec.id):await db.from("glaze_waste").insert(row);
    if(error){toast("خطأ: "+error.message);return false}
    toast(rec?"تم التعديل":"تم تسجيل الهالك");
    if(tab==="rep")report();
  });
  const upd=()=>{const g=parseInt(document.getElementById("m-g").value)||0,q=parseInt(document.getElementById("m-q").value)||0;document.getElementById("m-pct").innerHTML=g+q>0?`الإجمالي <b>${g+q}</b> · نسبة الهالك <b>${(q/(g+q)*100).toFixed(1)}%</b>`:""};
  document.getElementById("m-g").oninput=upd;document.getElementById("m-q").oninput=upd;upd();
}
function editW(id){waste(0,wRows.find(r=>r.id===id))}
async function delW(id){
  if(!await ask("حذف سجل الهالك ده؟"))return;
  const{data:dd,error}=await db.from("glaze_waste").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  report();toast("تم الحذف");
}

function newOrder(){
  const crow=()=>`<div class="two nr"><input placeholder="اللون" class="c"><input placeholder="الكمية" class="q" type="number" min="1" inputmode="numeric"></div>`;
  const blk=n=>`<div class="itemblk"><div class="ih"><b>الصنف ${n}</b><button type="button" class="rmi" style="display:${n>1?"block":"none"}">${ib("trash","حذف الصنف")}</button></div><input class="it" placeholder="اسم الصنف"><label>الألوان والكميات</label><div class="rows">${crow()}</div><button class="btn ghost sm addc" type="button">+ لون</button></div>`;
  openModal("طلبية جديدة",`<label>تاريخ الطلبية</label><input type="date" id="m-od" value="${today()}"><label>تاريخ التسليم (اختياري)</label><input type="date" id="m-due"><div id="m-items">${blk(1)}</div><button class="btn sm" id="m-addi" type="button" style="width:100%;margin-top:4px">+ إضافة صنف</button>`,async()=>{
    const blocks=[...document.querySelectorAll("#m-items .itemblk")].map(b=>({
      item:b.querySelector(".it").value.trim(),
      rs:[...b.querySelectorAll(".nr")].map(r=>({color:r.querySelector(".c").value.trim(),qty:parseInt(r.querySelector(".q").value)})).filter(r=>r.color||r.qty)
    })).filter(b=>b.item||b.rs.length);
    if(!blocks.length){toast("اكتب الصنف");return false}
    for(const [i,b] of blocks.entries()){
      if(!b.item){toast("اكتب اسم الصنف رقم "+(i+1));return false}
      if(!b.rs.length||b.rs.some(r=>!r.color||!(r.qty>0))){toast("كمّل ألوان وكميات الصنف: "+b.item);return false}
    }
    const od=document.getElementById("m-od").value||today(),due=document.getElementById("m-due").value||null,made=[];
    for(const b of blocks){
      const{data,error}=await db.from("glaze_orders").insert({item:b.item,order_date:od,due_date:due}).select().single();
      if(error){await rollback(made);toast("خطأ: "+error.message);return false}
      made.push(data.id);
      const e2=(await db.from("glaze_order_lines").insert(b.rs.map(r=>({order_id:data.id,color:r.color,qty_required:r.qty})))).error;
      if(e2){await rollback(made);toast("خطأ: "+e2.message);return false}
    }
    tab="open";setTab();await load();toast(blocks.length>1?"تمت إضافة "+blocks.length+" أصناف في الطلبية":"تمت إضافة الطلبية");
  });
  const box=document.getElementById("m-items");
  const renum=()=>[...box.querySelectorAll(".itemblk")].forEach((b,i)=>{b.querySelector(".ih b").textContent="الصنف "+(i+1);b.querySelector(".rmi").style.display=i>0?"block":"none"});
  document.getElementById("m-addi").onclick=()=>{
    box.insertAdjacentHTML("beforeend",blk(box.children.length+1));
    const nb=box.lastElementChild;if(typeof attachLists==="function")try{attachLists(nb)}catch(e){}
    nb.scrollIntoView({behavior:"smooth",block:"nearest"});nb.querySelector(".it").focus({preventScroll:true});
  };
  box.addEventListener("click",e=>{
    const t=e.target;
    if(t.classList.contains("addc"))t.parentElement.querySelector(".rows").insertAdjacentHTML("beforeend",crow());
    else if(t.classList.contains("rmi")){t.closest(".itemblk").remove();renum()}
  });
}
async function rollback(ids){for(const id of ids){try{await db.from("glaze_orders").delete().eq("id",id)}catch(e){}}}

function setTab(){
  ["open","done","rep","prod"].forEach(k=>{const b=document.getElementById("t-"+k);b.className="btn "+(k===tab?"on":"ghost")});
  document.getElementById("ordersView").style.display=tab==="open"||tab==="done"?"block":"none";
  document.getElementById("newOrder").style.display=tab==="open"?"block":"none";
  document.getElementById("freeRow").style.display=tab==="open"?"flex":"none";
  document.getElementById("repView").style.display=tab==="rep"?"block":"none";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  try{history.replaceState(null,"","#"+tab);window.markSub&&markSub()}catch(e){}
  if(tab==="rep"){skel("wBody",4);report()}
  else if(tab==="prod"){repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","glaze")}
  else renderOrders();
}

async function report(){
  /* select("*") بس: الربط القديم مع glaze_orders(item) كان بيفشل بعد ما الأصناف اتنقلت لجدول بنود الطلبية */
  const{data,error}=await db.from("glaze_waste").select("*").order("waste_date",{ascending:false});
  if(error){fail("wBody",report);return}
  wRows=(data||[]).map(w=>({id:w.id,d:String(w.waste_date||"").slice(0,10),item:w.item||"-",good:+w.good_qty||0,qty:+w.qty||0,reason:w.reason||""}));
  const s=document.getElementById("f-item"),cur=s.value;
  s.innerHTML='<option value="">الكل</option>'+[...new Set(wRows.map(r=>r.item))].map(v=>`<option>${esc(v)}</option>`).join("");
  s.value=cur;
  drawReport();
}
function filtered(){
  const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,i=document.getElementById("f-item").value;
  return wRows.filter(r=>{const day=r.d.slice(0,10);return(!f||day>=f)&&(!t||day<=t)&&(!i||r.item===i)});
}
const pct=(w,g)=>g+w>0?(w/(g+w)*100).toFixed(1)+"%":"-";
function drawReport(){
  {const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,i=document.getElementById("f-item").value,el=document.getElementById("wPd");if(el)el.textContent=(f||t?`من ${f?fmtD(f):"البداية"} إلى ${t?fmtD(t):"اليوم"}`:"كل الفترات")+(i?" · الصنف: "+i:"")}
  const rs=filtered(),W=rs.reduce((a,r)=>a+r.qty,0),G=rs.reduce((a,r)=>a+r.good,0);
  document.getElementById("wTotal").innerHTML=`سليم: ${G} · هالك: ${W} · الإجمالي: ${G+W}<br>نسبة الهالك: ${pct(W,G)}`;
  document.getElementById("wBody").innerHTML=rs.length?rs.map(r=>`<tr><td>${r.d?fmtD(r.d):"-"}</td><td>${esc(r.item)}</td><td>${r.good}</td><td>${r.qty}</td><td>${pct(r.qty,r.good)}</td><td>${esc(r.reason)}</td><td class="noprint" style="white-space:nowrap"><button class="btn ghost sm" onclick="editW(${r.id})">تعديل</button> <button class="btn ghost sm" onclick="delW(${r.id})">حذف</button></td></tr>`).join(""):'<tr><td colspan="7" class="empty">مفيش هالك مسجل</td></tr>';
}
function exportCsv(){
  const rs=filtered(),q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+["التاريخ,الصنف,سليم,هالك,النسبة,السبب",...rs.map(r=>[r.d.slice(0,10),r.item,r.good,r.qty,pct(r.qty,r.good),r.reason].map(q).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="هالك-الجليز.csv";a.click();
}

document.getElementById("t-open").onclick=()=>{tab="open";setTab()};
document.getElementById("t-done").onclick=()=>{tab="done";setTab()};
document.getElementById("t-rep").onclick=()=>{tab="rep";setTab()};
document.getElementById("t-prod").onclick=()=>{tab="prod";setTab()};
document.getElementById("newOrder").onclick=newOrder;
document.getElementById("freeBtn").onclick=()=>freeProduction("glaze",load);
document.getElementById("newWaste").onclick=()=>waste(0);
document.getElementById("f-go").onclick=drawReport;
document.getElementById("f-csv").onclick=exportCsv;

(async()=>{if(await requireAuth("glaze.html")){renderNav("glaze.html");searchBox("orders",q=>{Q=q;renderOrders()});dateChips("f-from","f-to",drawReport);skel("orders",3);if(tab==="prod")setTab();load().finally(settle)}})();
</script>
<script src="install.js" defer></script>
</body>
</html>

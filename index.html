<script>
// ملخص حي لكل قسم: [العدد الرئيسي, الوصف, إنتاج النهارده (للمجموع)]
const sumQ=r=>r.data.reduce((a,x)=>a+(+x.qty||0),0);
const openCount=async t=>{const r=await db.from(t).select("id",{count:"exact",head:true}).eq("status","open");if(r.error)throw r.error;return r.count};
const todayQty=async(t,col)=>{const r=await db.from(t).select("qty").eq(col,today());if(r.error)throw r.error;return sumQ(r)};
const SUMMARY={
  "glaze.html":async()=>{const[o,a,b]=await Promise.all([openCount("glaze_orders"),todayQty("glaze_production","prod_date"),freeTodayQty("glaze")]);return[o,"طلبية مفتوحة",a+b]},
  "decoration.html":async()=>{const[o,a,b]=await Promise.all([openCount("deco_orders"),todayQty("deco_production","prod_date"),freeTodayQty("deco")]);return[o,"طلبية مفتوحة",a+b]},
  "spray.html":async()=>{const[o,a,b]=await Promise.all([openCount("spray_status"),todayQty("spray_production","prod_date"),freeTodayQty("spray")]);return[o,"طلبية مفتوحة",a+b]},
  "repair.html":async()=>{const q=await todayQty("repair_log","repair_date");return[q,"تصليح النهارده",q,true]}
};
// تنبيه الطلبيات المتأخرة (حسب تاريخ التسليم، أو أكتر من 14 يوم من غير تسليم)
async function lateAlert(){
  const SRC={"glaze.html":"glaze_orders","decoration.html":"deco_orders","spray.html":"spray_orders"};
  const vs=visibleSections().filter(s=>SRC[s[0]]);
  const R=await Promise.all(vs.map(s=>db.from(SRC[s[0]]).select("id,item,order_date,due_date,status").eq("status","open").then(r=>({s,rows:r.data||[]}))));
  const late=[];
  R.forEach(({s,rows})=>rows.forEach(o=>{if(lateOrder(o))late.push({s,o,days:o.due_date?daysBetween(o.due_date,today()):ageDays(o.order_date)-LATE_DAYS})}));
  if(!late.length)return;
  late.sort((a,b)=>b.days-a.days);
  document.getElementById("tiles").insertAdjacentHTML("beforebegin",`<div class="card" id="latecard" style="border-color:var(--warn);margin-top:14px"><div class="top"><b class="ibt">${ui("alert")}طلبيات متأخرة (${late.length})</b></div>${late.slice(0,5).map(x=>`<a class="line" href="${x.s[0]}#open" style="display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink)"><span>${esc(x.o.item)} <span class="nums">· ${x.s[1]}</span></span><span class="tag late">متأخرة ${x.days} يوم</span></a>`).join("")}${late.length>5?`<div class="nums" style="margin-top:6px">و ${late.length-5} كمان…</div>`:""}</div>`);
}
// ===== توقّع التأخير: طلبيات لسه مش متأخرة بس بمعدل الإنتاج الحالي مش هتلحق ميعادها =====
async function riskAlert(){
  const document_=document.getElementById("riskcard");if(document_)document_.remove();
  const CFG={"glaze.html":["glaze_orders","glaze_lines_status","order_id","total_required","produced","glaze_production","prod_date"],
    "decoration.html":["deco_orders","deco_lines_status","order_id","total_required","produced","deco_production","prod_date"],
    "spray.html":["spray_orders","spray_status","id","qty_required","produced","spray_production","prod_date"]};
  const vs=visibleSections().filter(s=>CFG[s[0]]);
  const from=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const risk=[];
  await Promise.all(vs.map(async s=>{
    const[ot,lt,key,req,ok,pt,pd]=CFG[s[0]];
    const[o,l,p]=await Promise.all([
      db.from(ot).select("id,item,due_date,status").eq("status","open").not("due_date","is",null),
      db.from(lt).select("*"),prodRows(pt,pd,from)]);
    if(o.error||l.error)return;
    // معدل الإنتاج اليومي = إجمالي آخر 14 يوم ÷ عدد أيام الشغل الفعلية
    const days=new Set(p.map(r=>r[pd])).size,rate=days?p.reduce((a,r)=>a+(+r.qty||0),0)/days:0;
    if(rate<=0)return;
    const rem=new Map();
    l.data.forEach(r=>{const k=r[key],v=Math.max(0,(+r[req]||0)-(+r[ok]||0));rem.set(k,(rem.get(k)||0)+v)});
    // الأقرب تسليمًا الأول، والمتبقي بيتراكم عليهم
    let cum=0;
    o.data.filter(x=>x.due_date>=today()).sort((a,b)=>a.due_date<b.due_date?-1:1).forEach(x=>{
      const r=rem.get(x.id)||0;if(!r)return;cum+=r;
      const eta=Math.ceil(cum/rate*7/6),left=daysBetween(today(),x.due_date);
      if(eta>left)risk.push({s,o:x,gap:eta-left,left,eta});
    });
  }));
  if(!risk.length)return;
  risk.sort((a,b)=>b.gap-a.gap);
  document.getElementById("tiles").insertAdjacentHTML("beforebegin",`<div class="card" id="riskcard" style="border-color:var(--warn);margin-top:14px"><div class="top"><b class="ibt">${ui("hourglass")}معرّضة للتأخير (${risk.length})</b></div>${risk.slice(0,5).map(x=>`<a class="line" href="${x.s[0]}#open" style="display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink)"><span>${esc(x.o.item)} <span class="nums">· ${x.s[1]}</span></span><span class="tag late">باقي ${x.left} يوم وتحتاج ~${x.eta}</span></a>`).join("")}<div class="nums" style="margin-top:6px">تقدير مبني على معدل إنتاج آخر 14 يوم</div></div>`);
}
// ===== لوحة الإنتاج: آخر 7 أيام مقارنةً بالأسبوع اللي قبله =====
const DSRC={"glaze.html":["glaze_production","prod_date"],"decoration.html":["deco_production","prod_date"],"spray.html":["spray_production","prod_date"],"repair.html":["repair_log","repair_date"]};
async function prodRows(t,col,from){
  const out=[];
  for(let f=0;;f+=1000){
    const{data,error}=await db.from(t).select("id,qty,"+col).gte(col,from).order(col).order("id").range(f,f+999);
    if(error)throw error;out.push(...data);if(data.length<1000)break;
  }
  return out;
}
function drawChart(vs,days,vals){
  const W=340,H=190,pl=10,pr=10,pt=20,pb=28,bw=(W-pl-pr)/days.length,w=bw*.58,ch=H-pt-pb;
  const tot=vals.map(v=>v.reduce((a,b)=>a+b,0)),mx=Math.max(1,...tot);
  let g="";
  [0,.5,1].forEach(f=>{const y=pt+ch*(1-f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`});
  days.forEach((d,i)=>{
    const cx=pl+bw*i+bw/2;let y=pt+ch;
    const top=vals[i].map((v,k)=>v>0?k:-1).filter(k=>k>=0).pop();
    vals[i].forEach((v,k)=>{
      if(v<=0)return;const h=Math.max(2,v/mx*ch);y-=h;
      g+=`<rect class="seg-r" x="${cx-w/2}" y="${y}" width="${w}" height="${h}" rx="${k===top?4:0}" fill="${vs[k].s[3]}" style="animation-delay:${i*.05}s"><title>${esc(vs[k].s[1])}: ${nf(v)}</title></rect>`;
    });
    if(tot[i]>0)g+=`<text class="tot" x="${cx}" y="${y-5}" text-anchor="middle">${nf(tot[i])}</text>`;
    const lbl=new Date(d+"T00:00:00Z").toLocaleDateString("ar-EG",{weekday:"short",timeZone:"UTC"});
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" ${d===today()?'class="tot"':""}>${lbl}</text>`;
  });
  return `<svg class="dchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الإنتاج آخر 7 أيام">${g}</svg>`;
}
async function dash(){
  const vs=visibleSections().filter(s=>DSRC[s[0]]).map(s=>({s,t:DSRC[s[0]][0],c:DSRC[s[0]][1]}));
  if(!vs.length)return;
  const T=today(),from=addDays(T,-13);
  await Promise.all(vs.map(async x=>x.r=await prodRows(x.t,x.c,from)));
  // الإنتاج بدون طلبية بيتحسب مع كل قسم
  try{
    const fr=await db.from("free_production").select("section,qty,prod_date").gte("prod_date",from);
    if(!fr.error)(fr.data||[]).forEach(f=>{const x=vs.find(v=>DSRC[v.s[0]]&&v.s[0].startsWith(f.section==="deco"?"decoration":f.section));if(x)x.r.push({qty:f.qty,[x.c]:f.prod_date})});
  }catch(e){}
  const days=Array.from({length:7},(_,i)=>addDays(T,i-6)),prevDays=Array.from({length:7},(_,i)=>addDays(T,i-13));
  const sumOn=(x,d)=>x.r.reduce((a,r)=>a+(String(r[x.c]).slice(0,10)===d?(+r.qty||0):0),0);
  const vals=days.map(d=>vs.map(x=>sumOn(x,d)));
  const tot=vals.map(v=>v.reduce((a,b)=>a+b,0));
  const week=tot.reduce((a,b)=>a+b,0),prev=prevDays.reduce((a,d)=>a+vs.reduce((b,x)=>b+sumOn(x,d),0),0);
  const bi=tot.indexOf(Math.max(...tot)),best=tot[bi];
  let delta=null;
  if(prev>0){const p=Math.round((week-prev)/prev*100);delta=[p>0?"up":p<0?"down":"flat",(p>0?"▲ ":p<0?"▼ ":"")+Math.abs(p)+"% عن الأسبوع اللي قبله"]}
  else if(week>0)delta=["flat","مفيش بيانات للأسبوع اللي قبله"];
  const hk=document.getElementById("hk");hk.style.display="";
  kpis(hk,[["إنتاج النهارده",tot[6],"var(--pri)"],["آخر 7 أيام",week,"var(--ok)",{},delta],["أفضل يوم",best,null,{},best>0?["flat",new Date(days[bi]+"T00:00:00Z").toLocaleDateString("ar-EG",{weekday:"long",timeZone:"UTC"})]:null]]);
  const sums=vs.map((x,k)=>vals.reduce((a,v)=>a+v[k],0));
  document.getElementById("hc").innerHTML=`<div class="card"><div class="top"><b>الإنتاج آخر 7 أيام</b><span class="tag">${nf(week)}</span></div>${week>0?drawChart(vs,days,vals):'<div class="empty">مفيش إنتاج متسجّل الأسبوع ده</div>'}${week>0?`<div class="legend">${vs.map((x,k)=>`<span><i style="background:${x.s[3]}"></i>${x.s[1]} <b>${nf(sums[k])}</b></span>`).join("")}</div>`:""}</div>`;
}
async function fillSums(){
  let tot=0,n=0;
  await Promise.all([...document.querySelectorAll(".sum")].map(async el=>{
    let r=null;try{r=await SUMMARY[el.dataset.f]()}catch(e){}
    if(r){
      el.innerHTML=`<b></b> ${r[1]}`;countUp(el.querySelector("b"),r[0]);
      if(!r[3])el.nextElementSibling.textContent="إنتاج النهارده: "+nf(r[2]);
      tot+=r[2];n++;
    }else el.textContent="";
  }));
  const rs=document.getElementById("rsum");if(rs)rs.innerHTML=n?`إنتاج النهارده في كل الأقسام: <b style="color:var(--ok)">${nf(tot)}</b>`:"ملخص الإنتاج والطلبيات المتأخرة";
}
let homeReady=false;
function refreshHome(){
  if(!homeReady)return;
  const lc=document.getElementById("latecard");if(lc)lc.remove();
  lateAlert().catch(()=>{});riskAlert().catch(()=>{});dash().catch(()=>{});dash2().catch(()=>{});
  return fillSums();
}
window.__masRefresh=refreshHome;
async function init(){
  const session=await getSess();
  document.getElementById("login").style.display=session?"none":"grid";
  document.getElementById("home").style.display=session?"block":"none";
  if(!session){hideSplash();return}
  if(!await requireAuth("index.html")){hideSplash();return}
  renderNav("");
  if(ME.name)document.getElementById("hi").innerHTML='<span class="hi-ic">'+ui(new Date().getHours()<12?"sun":"moon")+'</span><span class="hi-w">'+(new Date().getHours()<12?"صباح الخير":"مساء الخير")+'،</span><span class="hi-n">'+esc(ME.name)+'</span>';
  document.getElementById("today").textContent=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("tiles").innerHTML=visibleSections().map(s=>`<a class="tile" href="${s[0]}" style="--c:${s[3]}"><span class="ico">${ico(s[2])}</span><b>${s[1]}</b><span class="sum" data-f="${s[0]}"><i class="sk"></i></span><span class="sum2"></span></a>`).join("")+
    soonSections().map(x=>`<div class="tile soon" style="--c:${x[2]}" aria-disabled="true"><span class="ico">${ico(x[1])}</span><b>${x[0]}</b><span class="sum">سوف تُنشأ قريبًا</span></div>`).join("")+
    (visibleSections().length?"":`<a class="tile wide" href="${PROD[0]}" style="--c:${PROD[3]}"><span class="ico">${ico(PROD[2])}</span><span class="tx"><b>${PROD[1]}</b><span class="sum2">سجّل إنتاج قسمك من هنا</span></span></a>`)+
    (!canReports()?"":`<a class="tile wide" href="${ORDERS[0]}" style="--c:${ORDERS[3]}"><span class="ico">${ico("checksq")}</span><span class="tx"><b>${ORDERS[1]}</b><span class="sum2">أنشئ الطلبية ووزّع أصنافها على الأقسام</span></span></a>`)+
    (!canReports()?"":`<a class="tile wide" href="${REPORTS[0]}" style="--c:${REPORTS[3]}"><span class="ico">${ico("chart")}</span><span class="tx"><b>${REPORTS[1]}</b><span class="sum2" id="rsum"><i class="sk" style="width:170px;height:14px"></i></span></span></a>`);
  lateAlert().catch(()=>{});riskAlert().catch(()=>{});
  dash().catch(()=>{});
  dash2().catch(()=>{});
  await fillSums();
  homeReady=true;
}
document.getElementById("lver").textContent="الإصدار "+APP_VERSION;
try{const le=localStorage.getItem("last_email");if(le)email.value=le}catch(e){}
document.getElementById("eye").onclick=()=>{const h=pass.type==="password";pass.type=h?"text":"password";eye.classList.toggle("on",h)};
const capsChk=e=>{caps.hidden=!(e.getModifierState&&e.getModifierState("CapsLock"))};
pass.addEventListener("keydown",capsChk);pass.addEventListener("keyup",capsChk);pass.addEventListener("blur",()=>caps.hidden=true);
function bad(m){
  err.textContent=m;Snd.play("error");
  const f=document.getElementById("lform");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
}
function welcome(name){
  if(document.documentElement.classList.contains("calm"))return;
  welg.textContent="مرحبًا بك";welt.textContent=name||"";
  const w=document.getElementById("wel");w.hidden=false;w.classList.remove("out");void w.offsetWidth;w.classList.add("in");
  // إعادة تشغيل حركات الداخل كل مرة
  w.querySelectorAll(".wc,.wg,b,.wl,.wsp i").forEach(e=>{e.style.animation="none";void e.offsetWidth;e.style.animation=""});
  setTimeout(()=>{w.classList.add("out");setTimeout(()=>{w.hidden=true;w.classList.remove("in","out")},450)},2300);
}
// الدخول بالاسم: لو المكتوب فيه @ يتعامل كإيميل، غير كده بنجيب الإيميل المرتبط بالاسم من السيرفر
const normName=s=>s.trim().replace(/\s+/g," ").toLowerCase();
async function emailFor(v){
  if(v.includes("@"))return v.toLowerCase();
  try{
    const r=await db.rpc("login_email",{p_name:normName(v)});
    if(r.error){bad(r.error.code==="PGRST202"?"لازم تشغّل ملف setup_username.sql على Supabase الأول":"تعذر التحقق من الاسم، حاول تاني");return false}
    return r.data||"unknown@invalid.example"; // اسم غير موجود/مكرر → نفس رسالة الخطأ العامة
  }catch(x){bad("تعذر الاتصال بالسيرفر، حاول تاني");return false}
}
document.getElementById("lform").onsubmit=async e=>{
  e.preventDefault();err.textContent="";
  const typed=email.value.trim(),pw=pass.value;
  if(!typed||!pw){bad(!typed?"اكتب الاسم":"اكتب كلمة السر");(!typed?email:pass).focus();return}
  if(!navigator.onLine){bad("مفيش اتصال بالإنترنت");return}
  go.disabled=true;go.classList.add("loading");
  const em=await emailFor(typed);
  if(em===false){go.disabled=false;go.classList.remove("loading");return}
  let error;try{({error}=await db.auth.signInWithPassword({email:em,password:pw}))}catch(x){error={message:"fetch"}}
  go.disabled=false;go.classList.remove("loading");
  if(error){bad(/fetch|network|load failed/i.test(error.message||"")?"تعذر الاتصال بالسيرفر، حاول تاني":"الاسم أو كلمة السر غلط");pass.select();return}
  try{rem.checked?localStorage.setItem("last_email",typed):localStorage.removeItem("last_email")}catch(x){}
  Snd.play("login");
  await init();
  if(typeof ME!=="undefined"&&ME&&ME.role)welcome(ME.name);
};
document.getElementById("forgot").onclick=async()=>{
  err.textContent="";const typed=email.value.trim();
  if(!typed){bad("اكتب اسمك الأول وبعدين اضغط نسيت كلمة السر");email.focus();return}
  forgot.disabled=true;
  const em=await emailFor(typed);
  if(!em||!/^\S+@\S+\.\S+$/.test(em)){forgot.disabled=false;if(em!==false)toast("لو الحساب مسجّل هيوصله رابط إعادة تعيين كلمة السر","ok");return}
  const{error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"index.html")});
  toast(error?"تعذر الإرسال: "+error.message:"لو الإيميل مسجّل هيوصله رابط إعادة تعيين كلمة السر",error?"bad":"ok");
  setTimeout(()=>forgot.disabled=false,30000);
};
init();
</script>
<script src="install.js" defer></script>

name: build-windows
# ملف واحد بيبني برنامج ويندوز كامل (MAS-Setup.exe) ويرفعه على Releases.
# الرابط اللي في صفحة التحميل: releases/latest/download/MAS-Setup.exe
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "اسم الإصدار على Releases"
        default: "win-latest"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create app files
        run: |
          mkdir -p windows-app/build
          cp icon-512.png windows-app/build/icon.png
          cat > windows-app/package.json <<'EOF'
          {
            "name": "mas-manager",
            "productName": "MAS",
            "version": "1.0.0",
            "description": "برنامج الماس لإدارة الإنتاج",
            "author": "MAS",
            "main": "main.js",
            "private": true,
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win --publish never"
            },
            "devDependencies": {
              "electron": "^33.2.0",
              "electron-builder": "^25.1.8"
            },
            "build": {
              "appId": "io.github.zat10924.mas",
              "productName": "MAS",
              "copyright": "MAS",
              "files": [
                "main.js",
                "offline.html",
                "build/icon.png"
              ],
              "directories": {
                "buildResources": "build",
                "output": "dist"
              },
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": [
                      "x64"
                    ]
                  }
                ],
                "icon": "build/icon.png",
                "artifactName": "MAS-Setup.exe"
              },
              "nsis": {
                "oneClick": false,
                "perMachine": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "MAS",
                "deleteAppDataOnUninstall": false
              }
            }
          }
          EOF
          cat > windows-app/main.js <<'EOF'
          // MAS — برنامج ويندوز: نافذة بتفتح موقع البرنامج، فالتحديثات بتوصل لوحدها من غير ما حد يعيد التثبيت.
          const { app, BrowserWindow, shell, Menu, session } = require("electron");
          const path = require("path");

          const SITE = "https://zat10924.github.io/index.html";
          const HOST = new URL(SITE).host;
          let win = null;

          if (!app.requestSingleInstanceLock()) { app.quit(); }
          else {
            app.on("second-instance", () => { if (win) { if (win.isMinimized()) win.restore(); win.focus(); } });
            app.whenReady().then(start);
            app.on("window-all-closed", () => app.quit());
          }

          function start() {
            Menu.setApplicationMenu(null);
            // الإشعارات مسموحة، وباقي الصلاحيات مقفولة
            session.defaultSession.setPermissionRequestHandler((_wc, perm, cb) => cb(perm === "notifications" || perm === "clipboard-sanitized-write"));

            win = new BrowserWindow({
              width: 1280, height: 820, minWidth: 420, minHeight: 600,
              title: "MAS", backgroundColor: "#421B24", autoHideMenuBar: true,
              icon: path.join(__dirname, "build", "icon.png"),
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true }
            });

            win.loadURL(SITE);
            win.webContents.on("did-fail-load", (_e, code, _d, url, isMain) => {
              if (isMain && code !== -3 && url.startsWith("http")) win.loadFile(path.join(__dirname, "offline.html"));
            });

            // الروابط الخارجية (واتساب، اتصال، مواقع تانية) بتفتح في المتصفح، وصفحات البرنامج نفسها جوه النافذة
            win.webContents.setWindowOpenHandler(({ url }) => {
              try { if (new URL(url).host === HOST) return { action: "allow" }; } catch (e) {}
              if (/^(https?|tel|mailto|whatsapp):/i.test(url)) shell.openExternal(url);
              return { action: "deny" };
            });
            win.webContents.on("will-navigate", (e, url) => {
              let ok = false;
              try { const u = new URL(url); ok = u.host === HOST || u.protocol === "file:"; } catch (x) {}
              if (!ok) { e.preventDefault(); if (/^(https?|tel|mailto|whatsapp):/i.test(url)) shell.openExternal(url); }
            });

            // اختصارات بدل القائمة المخفية
            win.webContents.on("before-input-event", (e, i) => {
              if (i.type !== "keyDown") return;
              const k = i.key.toLowerCase(), c = i.control || i.meta;
              if (k === "f5" || (c && k === "r")) { win.webContents.reloadIgnoringCache(); e.preventDefault(); }
              else if (k === "f11") { win.setFullScreen(!win.isFullScreen()); e.preventDefault(); }
              else if (c && (k === "=" || k === "+")) { win.webContents.setZoomLevel(win.webContents.getZoomLevel() + 0.5); e.preventDefault(); }
              else if (c && k === "-") { win.webContents.setZoomLevel(win.webContents.getZoomLevel() - 0.5); e.preventDefault(); }
              else if (c && k === "0") { win.webContents.setZoomLevel(0); e.preventDefault(); }
            });
          }
          EOF
          cat > windows-app/offline.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>MAS</title>
          <style>
          *{box-sizing:border-box;margin:0}
          body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;font-family:"Segoe UI",Tahoma,sans-serif;
          background:linear-gradient(135deg,#7d3243,#642631 48%,#421B24)}
          main{max-width:420px}
          h1{font-size:1.6rem;margin:18px 0 8px}
          p{color:#eadde0;line-height:1.8}
          button{margin-top:22px;padding:13px 34px;border:0;border-radius:14px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;
          background:linear-gradient(135deg,#B9984C,#E8D49B 45%,#D7B96F 70%,#B9984C);color:#421B24}
          button:focus-visible{outline:3px solid #fff;outline-offset:3px}
          svg{width:64px;height:64px;fill:none;stroke:#E8D49B;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
          </style></head><body><main>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
          <h1>مفيش اتصال بالإنترنت</h1>
          <p>البرنامج محتاج النت عشان يفتح. اتأكد من الاتصال وبعدها اضغط «إعادة المحاولة».</p>
          <button id="r" type="button">إعادة المحاولة</button>
          </main>
          <script>
          document.getElementById("r").onclick=()=>{location.href="https://zat10924.github.io/index.html"};
          addEventListener("online",()=>{location.href="https://zat10924.github.io/index.html"});
          </script></body></html>
          EOF
      - name: Install
        working-directory: windows-app
        run: npm install
      - name: Build installer
        working-directory: windows-app
        run: npm run dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'win-latest' }}
          name: MAS لويندوز
          files: windows-app/dist/MAS-Setup.exe
          make_latest: true
